<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thiết kế chặng 6–9 – Hình Học Không Gian Cùng AI</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ds.css">
<style>
/* ---------- bổ sung cho chặng 6–9 ---------- */
.screen.ipad{width:1180px;height:820px}
.screen.ipad .top{padding:0 22px}
.screen.ipad .body{padding:4px 22px 22px;gap:16px}
.rail a{text-align:center;line-height:1.2}
.seg span{white-space:nowrap}.field{white-space:nowrap}
.top .r{gap:8px}
.top .r .chip{padding:7px 12px;font-size:12px}
.top .r .ava{margin-left:4px}
.toggle.off{background:#CBD3E3}
.toggle.off::after{right:auto;left:3px}
.toggle.lk{opacity:.55}
.hd{display:flex;align-items:center;gap:10px}
.hd h2{margin:0}
.hd .end{margin-left:auto}
.end{margin-left:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sep{height:1px;background:var(--line);flex-shrink:0}
.b{font-weight:700}
.nowrap{white-space:nowrap}
.box{border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff}
.box.soft{background:var(--soft)}
.box.grn{border-color:#B9E6D2;background:var(--grn-s)}
.box.yel{border-color:#F4D58A;background:var(--yel-s)}
.box.org{border-color:#F7C2B3;background:var(--org-s)}
.box.pur{border-color:#D9CCFF;background:var(--pur-s)}
.box.pri{border-color:#C9D3F5;background:#F5F7FF}
.box.red{border-color:#F5B8B2;background:var(--red-s)}
.box.sel{border-color:var(--pri);background:#F5F7FF;box-shadow:0 0 0 3px rgba(59,91,219,.10)}
.box.dash{border-style:dashed;background:var(--soft)}
.icb.s{width:32px;height:32px;border-radius:10px}.icb.s svg.ic{width:17px;height:17px}
.icb.red{background:var(--red-s);color:var(--red)}
.icb.gry{background:#E7EBF4;color:var(--muted)}
.btn.red{background:var(--red)}
.btn.line{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn.redl{background:#fff;color:var(--red);border:1.5px solid #F5B8B2}
.btn.dis{background:#E7EBF4;color:var(--faint)}
.btn.full{width:100%}
.ck{width:20px;height:20px;border-radius:6px;border:2px solid #C3CBDD;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}
.ck.on{background:var(--pri);border-color:var(--pri)}
.ck svg.ic{width:13px;height:13px;stroke-width:3}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #C3CBDD;flex-shrink:0;background:#fff}
.rd.on{border:6px solid var(--pri)}
.lv{display:flex;gap:4px}.lv i{width:26px;height:9px;border-radius:99px;background:#E7EBF4}
.area{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:13.5px;line-height:1.55}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--pri)}
.tl>div.g::before{border-color:var(--grn)}.tl>div.y::before{border-color:var(--yel)}.tl>div.n::before{border-color:#C3CBDD}.tl>div.r::before{border-color:var(--red)}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
td.nr,th.nr{text-align:right}
tr.sel td{background:#F5F7FF}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pri)}
tbody tr:last-child td{border-bottom:none}
/* điện thoại */
.ph{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.ph-tag{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 0;flex-shrink:0}
.ph-tag .chip{font-size:10.5px;padding:3px 9px}
.ph-hd{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;flex-shrink:0}
.ph-hd b.t{font-size:17px;font-weight:800;display:block;line-height:1.25}
.ph-body{flex:1;min-height:0;padding:2px 14px 12px;display:flex;flex-direction:column;gap:10px}
.ph .card{border-radius:16px}
.ph .pad{padding:14px}
.ph h2{font-size:15px}
.tabbar{height:66px;background:#fff;border-top:1px solid var(--line);display:flex;flex-shrink:0;padding-bottom:6px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);position:relative}
.tabbar a.on{color:var(--pri)}
.tabbar a em{position:absolute;top:9px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--org);color:#fff;font-size:9.5px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px}
.ph-foot{background:#fff;border-top:1px solid var(--line);padding:10px 14px 18px;flex-shrink:0}
.bub{padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.45;max-width:270px}
.bub.in{background:#fff;border:1px solid var(--line);border-top-left-radius:6px}
.bub.out{background:var(--pri);color:#fff;border-top-right-radius:6px;margin-left:auto}
/* video */
.vt{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:8/5;display:flex;align-items:center;justify-content:center}
.vt .nm{position:absolute;left:6px;bottom:6px;background:rgba(15,20,35,.72);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:7px;display:flex;align-items:center;gap:4px}
.vt .nm svg.ic{width:11px;height:11px;stroke-width:2.4}
.vt .bd{position:absolute;right:6px;top:6px}
.vt.spk{box-shadow:0 0 0 3px #22C55E}
.cb{width:54px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted)}
.cb span{width:44px;height:44px;border-radius:50%;background:#EEF1F7;color:var(--text);display:flex;align-items:center;justify-content:center}
/* thời khóa biểu */
.tt{display:grid;grid-template-columns:64px repeat(6,1fr);gap:6px;flex:1;min-height:0;grid-template-rows:30px repeat(5,1fr)}
.tt .h{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.tt .p{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.tt .c{border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;font-size:13px;font-weight:700;border-left:4px solid;min-width:0}
.tt .c small{font-weight:500;font-size:11.5px;color:var(--muted);display:block}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/ds.js"></script>
<script>
/* ---------- icon bổ sung (chỉ gán thêm trong trang này) ---------- */
Object.assign(P,{
 mic:"M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4",
 micoff:"M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4M4 4l16 16",

 videooff:"M3 7h12v10H3zM15 10.5l6-3.5v10l-6-3.5M3 3l18 18",

 leave:"M4 15c5-5 11-5 16 0l-2 3-3.500-1.500v-2.500c-1.700-.500-3.300-.500-5 0v2.500L6 18z",
 user:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 20a8 8 0 0 1 16 0",
 link:"M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1",
 down:"M12 4v12M6 11l6 6 6-6M5 20h14",
 up:"M12 17V5M6 10l6-6 6 6M5 20h14",
 sliders:"M4 7h10M18 7h2M4 17h2M10 17h10M16 7m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0",
 chev:"M9 6l6 6-6 6",
 alert:"M12 4l9 16H3zM12 10v4M12 17v.5",
 info:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 11v5M12 7.500v.5",
 mail:"M3 6h18v12H3zM3 7l9 6 9-6",
 pin:"M12 21s7-6.500 7-11a7 7 0 0 0-14 0c0 4.500 7 11 7 11zM12 12a2.500 2.500 0 1 0 0-5 2.500 2.500 0 0 0 0 5",
 key:"M8 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8M12 11h9M18 11v3M15 11v2",
 moon:"M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500z",
 img:"M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01",
 grid:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
 more:"M5 12h.01M12 12h.01M19 12h.01"
});
const I=(n,z)=>ic(n,z?`width:${z}px;height:${z}px`:'');
const COL={An:'#F0522B','Bình':'#3B5BDB',Chi:'#E8A200','Dũng':'#B45309','Hà':'#D6336C',Lan:'#0F8A5F',Khoa:'#7C4DFF',Vy:'#0EA5E9',GV:'#3B5BDB'};
const av=(n,z=32,c)=>`<span class="av" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.38)}px;background:${c||COL[n]||'#64748B'}">${n==='GV'?'GV':n[0]}</span>`;
const NV={
 hs:[['home','Bài của em'],['cube','Tự học'],['trend','Tiến bộ'],['users','Nhóm học'],['clock','Lịch sử']],
 gv:[['home','Tổng quan'],['book','Kho đề'],['users','Lớp học'],['chart','Theo dõi'],['shield','Nhóm học'],['layers','Cộng đồng']],
 tr:[['home','Tổng quan'],['users','Lớp & GV'],['cal','Thời khóa biểu'],['bell','Thông báo'],['sliders','Chính sách'],['chart','Báo cáo']],
 ql:[['home','Tổng quan'],['file','Văn bản'],['school','Trường'],['key','Ủy quyền'],['chart','Báo cáo']]};
const WH={hs:['A','#F0522B'],gv:['GV','#3B5BDB'],tr:['QT','#7C4DFF'],ql:['QL','#0EA5E9']};
const ROLE={hs:'Học sinh',gv:'Giáo viên',tr:'Quản trị trường',ql:'Cơ quan quản lý'};
function frame(dev,id,role,on,title,crumb,body,st,top=''){
 return `<section class="screen ${dev==='ipad'?'ipad':''}" id="${id}">
 <nav class="rail"><div class="logo">${ic('cube')}</div>${NV[role].map((n,i)=>`<a class="${i===on?'on':''}">${ic(n[0],'width:22px;height:22px')}${n[1]}</a>`).join('')}<div class="sp"></div></nav>
 <div class="main"><div class="top"><div><h1>${title}</h1>${crumb?`<div class="crumb">${crumb}</div>`:''}</div>
 <div class="r">${top}<span class="chip">${ROLE[role]} · ${dev==='ipad'?'iPad ngang 1180×820':'Web 1440×900'}</span><span class="chip pur">${ic('spark')}Concept · Chặng ${st}</span><div class="ava" style="background:${WH[role][1]}">${WH[role][0]}</div></div></div>
 <div class="body">${body}</div></div></section>`;}
const web=(...a)=>frame('web',...a), ipad=(...a)=>frame('ipad',...a);
const TABS={
 ph:[['home','Tổng quan'],['trend','Tiến bộ'],['cal','Lịch'],['chat','Trao đổi']],
 gv:[['home','Hôm nay'],['users','Lớp học'],['check','Điểm danh'],['bell','Thông báo']]};
function phone(id,st,role,head,body,o={}){
 return `<section class="screen mobile" id="${id}"><div class="ph">
 <div class="ph-tag"><span class="chip">${role} · iPhone 390×844</span><span class="chip pur">${ic('spark')}Concept · Chặng ${st}</span></div>
 ${head}<div class="ph-body">${body}</div>${o.foot||''}
 ${o.tabs?`<div class="tabbar">${TABS[o.tabs].map((t,i)=>`<a class="${i===o.on?'on':''}">${I(t[0],22)}${t[1]}${o.badge&&o.badge[i]?`<em>${o.badge[i]}</em>`:''}</a>`).join('')}</div>`:''}
 </div></section>`;}
const back=`<div class="icb pri" style="width:36px;height:36px">${ic('arrow','transform:rotate(180deg);width:18px;height:18px')}</div>`;
const lv=(n,c)=>`<span class="lv">${[1,2,3,4,5].map(i=>`<i style="${i<=n?`background:${c}`:''}"></i>`).join('')}</span>`;
const SCREENS=[];
</script>

<!-- ======================= CHẶNG 6 ======================= -->
<script>
/* c6-01 · Học sinh · iPad · Tiến bộ của em */
const kn=(shape,c,name,n,word,cls,note)=>`<div class="row" style="gap:14px">
 <div style="width:46px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center">${sh[shape](c).replace('<svg','<svg style="height:40px"')}</div>
 <div class="grow"><div class="b">${name}</div><div class="small muted">${note}</div></div>
 ${lv(n,c)}<span class="chip ${cls}" style="width:112px;justify-content:center">${word}</span></div>`;
SCREENS.push(ipad('c6-01-hs-tien-bo-cua-em','hs',2,'Tiến bộ của em','Chủ nhật 22/11 · so với chính em tuần trước, không xếp hạng với bạn khác',`
<div class="col grow" style="gap:14px;min-width:0">
 <div class="card" style="padding:18px 20px;background:linear-gradient(120deg,#3B5BDB,#7C4DFF);color:#fff;border:none;display:flex;align-items:center;gap:18px">
  <div style="width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center">${I('trend',38)}</div>
  <div class="grow"><div style="font-size:18px;font-weight:800">Em tự giải 4 bài không cần gợi ý!</div>
   <div style="opacity:.9;margin-top:2px">Tuần trước là 2 bài. Em đang tiến rất chắc.</div></div>
  <div style="display:flex;gap:10px">
   ${[['5/6','bài đã xong'],['3','ngày liên tiếp'],['12','câu em đã hỏi']].map(x=>`<div style="background:rgba(255,255,255,.16);border-radius:14px;padding:9px 14px;text-align:center;min-width:92px"><div style="font-size:21px;font-weight:800;line-height:1.15">${x[0]}</div><div style="font-size:11.5px;opacity:.9">${x[1]}</div></div>`).join('')}</div></div>
 <div class="card pad col grow" style="gap:0">
  <div class="hd"><h2>Em nắm các khái niệm đến đâu</h2><span class="chip end">${I('info')}Ước lượng từ bài em đã làm</span></div>
  <div class="col grow" style="justify-content:space-around;gap:6px;margin-top:8px">
  ${kn('chop','#0F8A5F','Thể tích khối chóp',5,'Vững vàng','grn','7 bài · 6 bài em tự làm trọn vẹn')}
  ${kn('lang','#0F8A5F','Hình chiếu vuông góc',4,'Vững vàng','grn','8 bài · em xác định hình chiếu rất nhanh')}
  ${kn('chop','#3B5BDB','Góc giữa đường thẳng và mặt phẳng',3,'Đang tiến bộ','pri','6 bài · 2 bài gần nhất em tự sửa được chỗ nhầm')}
  ${kn('hop','#E8A200','Khoảng cách từ điểm đến mặt phẳng',2,'Đang làm quen','yel','5 bài · em thường cần gợi ý ở bước dựng đường vuông góc')}
  ${kn('lang','#7C4DFF','Góc giữa hai mặt phẳng',1,'Mới bắt đầu','pur','3 bài · chủ đề mới, cứ từ từ nhé')}
  </div>
  <div class="small muted" style="margin-top:6px">Chạm vào từng dòng để xem những bài và câu hỏi làm căn cứ.</div>
 </div>
</div>
<div class="col" style="width:352px;flex-shrink:0;gap:14px">
 <div class="card pad col" style="gap:10px"><h2 style="margin:0">Điều em đã làm tốt</h2>
  ${[['check','grn','Tự phát hiện và sửa lỗi','Bài 19: em tự đổi SA/SD thành SA/AD trước khi nộp'],['bulb','yel','Hỏi đúng chỗ vướng','“Vì sao H nằm trên SO?” là một câu hỏi rất hay'],['flame','org','Học đều đặn','3 ngày liên tiếp, mỗi ngày khoảng 30 phút']].map(x=>`<div class="row" style="align-items:flex-start"><div class="icb s ${x[1]}">${ic(x[0])}</div><div><div class="b" style="font-size:13.5px">${x[2]}</div><div class="small muted">${x[3]}</div></div></div>`).join('')}
 </div>
 <div class="card pad col grow" style="gap:10px"><h2 style="margin:0">Gợi ý luyện tiếp</h2>
  <div class="box pri col" style="gap:8px"><div class="row"><div class="icb s pri">${ic('cube')}</div><div class="grow"><div class="b" style="font-size:13.5px">Dựng đường vuông góc từ A xuống (SBD)</div><div class="tiny muted">3 bài ngắn · khoảng 10 phút · có gợi ý từng bước</div></div></div>
   <div class="row"><span class="chip grn">${ic('shield')}Đã kiểm chứng</span><span class="btn sm end">${ic('play')}Luyện ngay</span></div></div>
  <div class="box col" style="gap:8px"><div class="row"><div class="icb s pur">${ic('eye')}</div><div class="grow"><div class="b" style="font-size:13.5px">Xem lại bài 15 bằng hình 3D</div><div class="tiny muted">Lời giải đã mở · xoay hình để thấy tam giác vuông</div></div></div>
   <div class="row"><span class="chip">Giáo viên gợi ý</span><span class="btn sm ghost end">Mở bài</span></div></div>
  <div class="grow"></div>
  <div class="row small muted" style="align-items:flex-start;gap:8px">${I('lock',16)}<span>Trang này chỉ có em và giáo viên của em xem. Phụ huynh chỉ thấy bản tóm tắt giáo viên đã duyệt.</span></div>
 </div>
</div>`,6));

/* c6-02 · Giáo viên · Web · Ghi nhận can thiệp */
const ev=(on,icn,cls,t,d,extra='')=>`<div class="box ${on?'':'soft'}" style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px"><span class="ck ${on?'on':''}" style="margin-top:2px">${on?ic('check'):''}</span><div class="icb s ${cls}">${ic(icn)}</div><div class="grow"><div class="b" style="font-size:13.5px">${t}</div><div class="small muted">${d}</div>${extra}</div></div>`;
const sug=(t,d,cf,cc,state)=>`<div class="box ${state==='x'?'dash':''}" style="display:flex;gap:12px;align-items:center;${state==='x'?'opacity:.75':''}">
 <div class="grow"><div class="b" style="${state==='x'?'text-decoration:line-through;color:var(--muted)':''}">${t}</div><div class="small muted" style="margin-top:2px">${d}</div></div>
 <span class="chip ${cc}">Tin cậy: ${cf}</span>
 ${state==='ok'?`<span class="btn sm grn">${ic('check')}Đã xác nhận</span>`:state==='ed'?`<span class="btn sm soft">${ic('edit')}Đã sửa</span>`:state==='x'?`<span class="btn sm line">${ic('x')}Đã bỏ</span>`:''}
 <span class="icb s gry">${ic('more')}</span></div>`;
SCREENS.push(web('c6-02-gv-ghi-nhan-can-thiep','gv',3,'Ghi nhận can thiệp · An (11A1)','Theo dõi › Hồ sơ học tập › An › Ghi nhận mới · mọi nhận định đều gắn với bài và câu hỏi cụ thể',`
