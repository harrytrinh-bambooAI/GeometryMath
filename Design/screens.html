<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thiết kế màn hình – Hình Học Không Gian Cùng AI</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FB;--panel:#fff;--soft:#F7F9FD;--line:#E3E8F2;--text:#141B2D;--muted:#5F6B85;--faint:#98A2B8;
  --pri:#3B5BDB;--pri-d:#2F49B5;--pri-s:#E9EEFF;--org:#F0522B;--org-s:#FFEDE7;--grn:#0F8A5F;--grn-s:#DFF5EC;
  --yel:#E8A200;--yel-s:#FFF4D6;--pur:#7C4DFF;--pur-s:#EFE9FF;--sky:#0EA5E9;--sky-s:#E0F4FE;--red:#D92D20;--red-s:#FDE7E5;
  --r:16px;--r-sm:11px;--sh:0 1px 2px rgba(20,27,45,.05),0 6px 20px rgba(20,27,45,.06);
}
*{box-sizing:border-box}
body{margin:0;background:#D9DEEA;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);font-size:14px;line-height:1.45}
.screen{width:1440px;height:900px;background:var(--bg);display:grid;grid-template-columns:92px 1fr;overflow:hidden;position:relative;margin:30px auto}
.screen.mobile{width:390px;height:844px;display:block}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* rail */
.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#3B5BDB,#7C4DFF);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.logo svg{width:26px;height:26px}
.rail a{width:76px;padding:9px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.rail a.on{background:var(--pri-s);color:var(--pri)}
.rail .sp{flex:1}
/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{height:66px;display:flex;align-items:center;gap:14px;padding:0 26px;flex-shrink:0}
.top h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .crumb{color:var(--muted);font-size:13px;font-weight:500}
.top .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.seg{display:flex;background:#E7EBF4;border-radius:99px;padding:3px;font-size:12.5px;font-weight:700}
.seg span{padding:6px 14px;border-radius:99px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg span.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg svg.ic{width:15px;height:15px}
.ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.body{flex:1;padding:4px 26px 24px;min-height:0;display:flex;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
h2{font-size:16px;margin:0 0 10px;font-weight:800}
h3{font-size:14px;margin:0;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column;gap:12px} .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip svg.ic{width:13px;height:13px;stroke-width:2.3}
.chip.grn{background:var(--grn-s);color:var(--grn);border-color:transparent}
.chip.org{background:var(--org-s);color:var(--org);border-color:transparent}
.chip.pri{background:var(--pri-s);color:var(--pri);border-color:transparent}
.chip.yel{background:var(--yel-s);color:#9A6B00;border-color:transparent}
.chip.pur{background:var(--pur-s);color:var(--pur);border-color:transparent}
.chip.red{background:var(--red-s);color:var(--red);border-color:transparent}
.chip.on{background:var(--pri);color:#fff;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;background:var(--pri);color:#fff;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--pri);border:1.5px solid #C9D3F5}
.btn.soft{background:var(--pri-s);color:var(--pri)}
.btn.org{background:var(--org)} .btn.grn{background:var(--grn)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn svg.ic{width:16px;height:16px}
.icb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icb.pri{background:var(--pri-s);color:var(--pri)} .icb.org{background:var(--org-s);color:var(--org)} .icb.grn{background:var(--grn-s);color:var(--grn)}
.icb.yel{background:var(--yel-s);color:#B07A00} .icb.pur{background:var(--pur-s);color:var(--pur)} .icb.sky{background:var(--sky-s);color:var(--sky)}
.field{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.field svg.ic{color:var(--muted);width:17px;height:17px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.toggle{width:40px;height:23px;border-radius:99px;background:var(--pri);position:relative;flex-shrink:0}
.toggle::after{content:"";position:absolute;right:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff}
.bar{height:8px;border-radius:99px;background:#E7EBF4;overflow:hidden} .bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
table{border-collapse:collapse;width:100%;font-size:13px} th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #EEF1F7;vertical-align:middle}
.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#E7EBF4;color:#fff;margin-right:3px}
.dot.on{background:var(--yel)} .dot.g{background:var(--grn)} .dot svg.ic{width:12px;height:12px;stroke-width:2.6}
.ribbon{position:absolute;top:18px;right:-54px;transform:rotate(35deg);background:var(--pur);color:#fff;font-weight:800;font-size:11.5px;padding:6px 64px;letter-spacing:.04em;z-index:9}
/* workspace */
.canvas{position:relative;flex:1;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;
  background-image:radial-gradient(#DCE2EF 1.1px,transparent 1.1px);background-size:22px 22px}
.prob{position:absolute;top:14px;left:14px;right:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh);font-weight:500}
.dock{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px;display:flex;gap:4px;box-shadow:0 8px 28px rgba(20,27,45,.14)}
.dock b{width:66px;padding:7px 0 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted)}
.dock b.on{background:var(--pri);color:#fff} .dock i{width:1px;background:var(--line);margin:4px 3px}
.views{position:absolute;right:14px;top:86px;display:flex;flex-direction:column;gap:6px}
.views span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center;box-shadow:var(--sh)}
.views svg.ic{width:14px;height:14px}
.meas{position:absolute;left:14px;bottom:18px;display:flex;flex-direction:column;gap:6px}
.meas span{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:#fff;border:1.5px solid var(--org);color:var(--org);border-radius:9px;padding:4px 9px}
.fig{position:absolute;left:0;right:0;top:78px;bottom:84px;display:flex;align-items:center;justify-content:center}
.fig svg{height:100%;max-width:92%}
.side{width:384px;flex-shrink:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tabs span{flex:1;text-align:center;padding:8px 0;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.tabs span.on{background:var(--pri-s);color:var(--pri)} .tabs svg.ic{width:16px;height:16px}
.hint{border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;gap:11px;background:#fff}
.hint.act{border-color:var(--pri);background:#F5F7FF}
.hint.lock{border-style:dashed;background:var(--soft)}
.hint p{margin:3px 0 0;color:var(--muted);font-size:12.8px}
.steps{display:flex;gap:6px;align-items:center}
.steps i{flex:1;height:6px;border-radius:99px;background:#E7EBF4} .steps i.on{background:var(--yel)} .steps i.g{background:var(--grn)}
.num{width:26px;height:26px;border-radius:50%;background:#E7EBF4;color:var(--muted);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.num.on{background:var(--pri);color:#fff} .num.done{background:var(--grn);color:#fff}
.thumb{height:118px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.thumb svg{height:92px}
.stat{display:flex;gap:12px;align-items:center;padding:14px 16px;flex:1}
.stat b{font-size:24px;font-weight:800;line-height:1.1;display:block}
.paper{background:#FFFDF6;border:1px solid #EADFC4;border-radius:12px;padding:16px;font-family:'Comic Sans MS','Bradley Hand',cursive;color:#2B3A67;font-size:14px;line-height:1.9;position:relative}
.mark{position:absolute;border:2px solid var(--org);border-radius:8px;background:rgba(240,82,43,.08)}
.kbd{font-family:'JetBrains Mono',monospace;font-weight:700}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P={home:"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",book:"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M9 8h6",users:"M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 19v-1a4 4 0 0 0-3-3.8M15.5 3.2a3.5 3.5 0 0 1 0 6.6",chart:"M4 20V10M10 20V4M16 20v-7M22 20H2",cube:"M12 2l9 5v10l-9 5-9-5V7zM12 12l9-5M12 12v10M12 12L3 7",bulb:"M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z",lock:"M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3",unlock:"M6 11h12v9H6zM8 11V8a4 4 0 0 1 7.5-2",check:"M5 12.5l4.5 4.5L19 7.5",shield:"M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6zM8.5 12l2.5 2.5 4.5-5",clock:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2",chat:"M4 5h16v11H9l-5 4z",send:"M4 12l16-8-6 16-3-6z",cursor:"M5 3l14 7-6 2-2 6z",point:"M12 12m-3.2 0a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0-6.4 0",line:"M6.5 17.5l11-11M5 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M19 5m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0",plane:"M3 17l5-10h13l-5 10z",ruler:"M3 17L17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2",angle:"M4 19h16M4 19L16 5M11.5 19a8 8 0 0 0-2.4-5.6",axes:"M5 20V4M5 20h15M5 20l8-7",reset:"M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4",search:"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14M20 20l-4-4",plus:"M12 5v14M5 12h14",camera:"M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7",flame:"M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.500 1.500-5.500 1 1 2.500 1 3.500-4.500z",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6",cal:"M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",spark:"M12 3l2 6.500 6.500 2-6.500 2-2 6.500-2-6.500L3.500 11.500l6.500-2z",play:"M7 4l12 8-12 8z",edit:"M4 20h4L19 9l-4-4L4 16zM13 7l4 4",file:"M6 3h8l4 4v14H6zM14 3v4h4",school:"M3 10l9-5 9 5-9 5zM7 12.500v4.500c2 2 8 2 10 0v-4.500M21 10v6",bldg:"M5 21V4h9v17M14 9h5v12M3 21h18M8 8h3M8 12h3M8 16h3",bell:"M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20.500a2 2 0 0 0 4 0",arrow:"M5 12h14M13 6l6 6-6 6",x:"M6 6l12 12M18 6L6 18",trend:"M3 17l6-6 4 4 8-8M15 7h6v6",heart:"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z",layers:"M12 3l9 5-9 5-9-5zM3 13l9 5 9-5",flag:"M5 21V4M5 4h12l-2 4 2 4H5"};
const ic=(n,s)=>`<svg class="ic" viewBox="0 0 24 24"${s?` style="${s}"`:''}><path d="${P[n]}"/></svg>`;

/* ---------- hình ---------- */
function pyramid(o={}){const hl=o.hl, ang=o.ang, proj=o.proj, mid=o.mid;
return `<svg viewBox="0 0 440 360" xmlns="http://www.w3.org/2000/svg">
<polygon points="80,268 256,312 372,250 196,214" fill="#3B5BDB" fill-opacity=".09"/>
<polygon points="176,44 256,312 372,250" fill="#3B5BDB" fill-opacity=".13"/>
<polygon points="176,44 80,268 256,312" fill="#3B5BDB" fill-opacity=".07"/>
${proj?`<polygon points="176,44 196,214 372,250" fill="#F0522B" fill-opacity=".16"/>`:''}
<g stroke="#253150" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M80,268L256,312L372,250M176,44L80,268M176,44L256,312"/></g>
<g stroke="#253150" stroke-width="1.8" fill="none" stroke-dasharray="7 6" opacity=".65"><path d="M80,268L196,214L372,250M176,44L196,214"/></g>
${proj?`<line x1="196" y1="214" x2="372" y2="250" stroke="#F0522B" stroke-width="3" stroke-dasharray="8 6"/><path d="M194.4,200.1L208.1,202.9L209.7,216.8" fill="none" stroke="#F0522B" stroke-width="2"/>`:''}
${hl?`<line x1="176" y1="44" x2="372" y2="250" stroke="#F0522B" stroke-width="4" stroke-linecap="round"/>`:`<line x1="176" y1="44" x2="372" y2="250" stroke="#253150" stroke-width="2.4" stroke-linecap="round"/>`}
${ang?`<path d="M336,242.600 A36,36 0 0 1 347.200,223.900" fill="none" stroke="#F0522B" stroke-width="2.6"/><text x="300" y="236" fill="#F0522B" font-size="15" font-weight="800">45°</text>`:''}
${mid?`<circle cx="274" cy="147" r="6" fill="#7C4DFF"/><text x="284" y="142" fill="#7C4DFF" font-size="16" font-weight="800">M</text>`:''}
<g fill="#141B2D"><circle cx="80" cy="268" r="5"/><circle cx="256" cy="312" r="5"/><circle cx="372" cy="250" r="5"/><circle cx="196" cy="214" r="5"/><circle cx="176" cy="44" r="5"/></g>
<g fill="#141B2D" font-size="19" font-weight="800" font-family="Be Vietnam Pro"><text x="160" y="34">S</text><text x="56" y="282">B</text><text x="250" y="340">C</text><text x="384" y="256">D</text><text x="168" y="210">A</text></g></svg>`;}
const sh={
 chop:c=>`<svg viewBox="0 0 100 90"><polygon points="20,70 62,80 88,62 46,54" fill="${c}" fill-opacity=".15"/><path d="M20,70L62,80L88,62M42,10L20,70M42,10L62,80M42,10L88,62" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><path d="M20,70L46,54L88,62M42,10L46,54" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/></svg>`,
 hop:c=>`<svg viewBox="0 0 100 90"><polygon points="14,30 62,30 62,78 14,78" fill="${c}" fill-opacity=".14"/><path d="M14,30H62V78H14zM14,30L36,12H84L62,30M84,12V60L62,78" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><path d="M36,12V60H84M36,60L14,78" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/></svg>`,
 lang:c=>`<svg viewBox="0 0 100 90"><polygon points="12,74 50,82 30,56" fill="${c}" fill-opacity=".16"/><path d="M12,74L50,82M12,74L52,22L90,30L50,82M52,22L70,4L90,30" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><path d="M12,74L30,56L50,82M30,56L70,4" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/></svg>`,
 non:c=>`<svg viewBox="0 0 100 90"><ellipse cx="50" cy="70" rx="34" ry="11" fill="${c}" fill-opacity=".15"/><path d="M16,70A34,11 0 0 0 84,70M50,8L16,70M50,8L84,70" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M16,70A34,11 0 0 1 84,70M50,8V70" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/></svg>`,
 tru:c=>`<svg viewBox="0 0 100 90"><ellipse cx="50" cy="18" rx="30" ry="9" fill="${c}" fill-opacity=".15" stroke="${c}" stroke-width="2.4"/><path d="M20,18V70A30,9 0 0 0 80,70V18" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M20,70A30,9 0 0 1 80,70" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/></svg>`,
 cau:c=>`<svg viewBox="0 0 100 90"><circle cx="50" cy="45" r="34" fill="${c}" fill-opacity=".13" stroke="${c}" stroke-width="2.4"/><path d="M16,45A34,11 0 0 0 84,45" fill="none" stroke="${c}" stroke-width="2"/><path d="M16,45A34,11 0 0 1 84,45" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/></svg>`};

/* ---------- khung ---------- */
const NAV={
 gv:[['home','Tổng quan'],['book','Kho đề'],['users','Lớp học'],['chart','Theo dõi']],
 hs:[['home','Bài của em'],['cube','Tự học'],['clock','Lịch sử']],
 nh:[['home','Bài của em'],['cube','Tự học'],['users','Nhóm học'],['clock','Lịch sử']],
 ph:[['home','Tổng quan'],['chart','Tiến bộ'],['cal','Lịch'],['chat','Trao đổi']],
 tr:[['home','Tổng quan'],['users','Lớp & GV'],['cal','Thời khóa biểu'],['bell','Thông báo'],['chart','Báo cáo']],
 ql:[['home','Tổng quan'],['file','Chính sách'],['school','Trường'],['chart','Báo cáo']]};
const WHO={nh:['A','#F0522B'],gv:['GV','#3B5BDB'],hs:['A','#F0522B'],ph:['PH','#0F8A5F'],tr:['QT','#7C4DFF'],ql:['QL','#0EA5E9']};
function screen(id,role,on,title,crumb,body,o={}){
 return `<section class="screen" id="${id}">
 <nav class="rail"><div class="logo">${ic('cube')}</div>${NAV[role].map((n,i)=>`<a class="${i===on?'on':''}">${ic(n[0],'width:22px;height:22px')}${n[1]}</a>`).join('')}<div class="sp"></div></nav>
 <div class="main"><div class="top"><div><h1>${title}</h1>${crumb?`<div class="crumb">${crumb}</div>`:''}</div>
 <div class="r">${o.concept?`<span class="chip pur" style="padding:8px 14px;font-size:12.5px">${ic('spark')}Concept · chưa có trong MVP</span>`:''}${o.noSeg?'':`<div class="seg"><span class="${role==='gv'?'on':''}">${ic('school')}Giáo viên</span><span class="${role==='hs'?'on':''}">${ic('users')}Học sinh</span></div>`}<div class="ava" style="background:${WHO[role][1]}">${WHO[role][0]}</div></div></div>
 <div class="body">${body}</div></div></section>`;}

/* =================== MVP =================== */
const probCard=(t,topic,lv,shape,c,ok=true)=>`<div class="card pad col" style="gap:10px">
 <div class="thumb">${sh[shape](c)}</div>
