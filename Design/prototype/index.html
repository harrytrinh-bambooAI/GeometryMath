<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype – Hình Học Không Gian Cùng AI</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">
<link rel="stylesheet" href="fig3d.css">
<link rel="stylesheet" href="tour.css">
<style>
body{background:#141B2D;overflow:hidden}
#demo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 16px;color:#fff;font-size:12px;white-space:nowrap}
#demo b.t{font-size:13.5px;margin-right:4px}
#demo .roles{display:flex;background:rgba(255,255,255,.1);border-radius:99px;padding:3px}
#demo .roles span,#demo .sc span{padding:5px 11px;border-radius:99px;font-weight:700;cursor:pointer;color:#C9D2E6}
#demo .roles span.on{background:#fff;color:#3B5BDB}
#demo .sc{display:flex;gap:4px;align-items:center}
#demo .sc span{background:rgba(255,255,255,.07);font-weight:600}
#demo .sc span:hover{background:rgba(255,255,255,.18)}
#demo .sc span.on{background:#F0522B;color:#fff}
#demo .sc span.cz{border:1px dashed rgba(255,255,255,.3)}
#demo .lbl2{color:#8F9BB5;font-weight:700;margin-left:8px}
#app .screen{width:100%;height:calc(100vh - var(--dh,58px));margin:0;border-radius:16px 16px 0 0}
#app .body{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[data-act],[data-go]{cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
.card[data-act]:hover,.card[data-go]:hover,.hint[data-act]:hover,.hint[data-go]:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,27,45,.12)}
.btn:hover{filter:brightness(1.07)} .chip[data-act]:hover{filter:brightness(.96)}
.rail a{cursor:pointer} .rail a:hover{background:#F1F4FA}
input.in,textarea.in{border:none;outline:none;background:transparent;font:inherit;color:inherit;flex:1;min-width:0;resize:none}
#toast{position:fixed;left:50%;top:calc(var(--dh,58px) + 14px);transform:translate(-50%,-20px);background:#141B2D;color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:99;display:flex;gap:9px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:var(--dh,58px) 0 0 0;background:rgba(243,245,251,.82);display:none;align-items:center;justify-content:center;z-index:90;flex-direction:column;gap:14px;font-weight:700;font-size:16px}
#busy.on{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid #D9E0F5;border-top-color:#3B5BDB;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ov{position:absolute;inset:0;background:rgba(20,27,45,.45);display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .2s}
.modal{background:#fff;border-radius:20px;padding:24px;width:500px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.dock b{cursor:pointer}.dock b:hover{background:#EEF1F8}.dock b.on:hover{background:var(--pri)}
.tabs span{cursor:pointer}
.bub{padding:9px 12px;border-radius:14px;font-size:13px;max-width:270px}
.bub.me{background:var(--pri);color:#fff;align-self:flex-end}.bub.ot{background:var(--soft);border:1px solid var(--line);align-self:flex-start}
.bub.ai{background:var(--pur-s);border:1px solid #D9CCFF;align-self:flex-start}
.scroll{overflow-y:auto;min-height:0}
.flow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);background:#fff;border:1px dashed #C9D3F5;border-radius:12px;padding:8px 12px}
.flow i{font-style:normal;color:var(--pri)}
input[type=range]{width:100%;accent-color:#3B5BDB}

#app{display:flex;justify-content:center;overflow:hidden}
@media(max-width:820px){#demo{flex-wrap:nowrap;overflow-x:auto}#demo i{display:none}}
/* ---- iPad ---- */
.dev-ipad .body{gap:14px;padding:4px 18px 18px}.dev-ipad .top{padding:0 18px}.dev-ipad .side{width:340px}
.dev-ipad .dock b{width:62px;padding:9px 0 7px}.dev-ipad .btn{padding:12px 16px}.dev-ipad .rail a{padding:11px 0 9px}
/* ---- iPhone ---- */
.dev-phone .screen{display:block}
.dev-phone .main{height:100%;padding-bottom:66px}
.dev-phone .rail{position:absolute;left:0;right:0;bottom:0;height:66px;flex-direction:row;padding:6px 6px 10px;border-right:none;border-top:1px solid var(--line);z-index:15;gap:2px;justify-content:space-around}
.dev-phone .rail .logo,.dev-phone .rail .sp{display:none}
.dev-phone .rail a{width:auto;flex:1;font-size:9.5px;padding:6px 0 4px;gap:2px;white-space:nowrap}
.dev-phone .top{height:auto;padding:12px 14px 8px;gap:8px}.dev-phone .top h1{font-size:17px;line-height:1.25}.dev-phone .top .crumb{font-size:11.5px}
.dev-phone .top .ava{display:none}.dev-phone .top .chip.pur{font-size:0;padding:7px;gap:0}.dev-phone .top .btn.sm{font-size:0;gap:0;padding:8px}
.dev-phone .body{flex-direction:column;overflow-y:auto;padding:4px 12px 16px;gap:12px}
.dev-phone .body>*{width:100%!important;flex:none!important;max-width:none!important}
.dev-phone .scroll{overflow:visible!important}
.dev-phone .body>.canvas,.dev-phone .body .canvas{height:390px!important}
.dev-phone .prob{font-size:12px;padding:8px 10px;gap:8px;top:10px;left:10px;right:10px}.dev-phone .prob .icb{display:none}.dev-phone .prob .chip{font-size:0;padding:6px;gap:0}
.dev-phone .fig{top:74px;bottom:70px}.dev-phone .views{display:none}.dev-phone .meas{bottom:70px!important;left:10px}
.dev-phone .dock{bottom:10px;padding:5px;gap:1px}.dev-phone .dock b{width:40px;font-size:0;padding:10px 0;gap:0}.dev-phone .dock i{margin:4px 1px}
.dev-phone .side{min-height:300px}
.dev-phone [style*="grid-template-columns"]{grid-template-columns:1fr 1fr!important;gap:10px!important}
.dev-phone .row{flex-wrap:wrap}.dev-phone .hint,.dev-phone .field,.dev-phone .tabs,.dev-phone .steps,.dev-phone .dock{flex-wrap:nowrap}
.dev-phone .stat{flex:1 1 42%;padding:10px 12px}.dev-phone .stat b{font-size:20px}
.dev-phone table{display:block;overflow-x:auto;white-space:nowrap}
.dev-phone .modal{width:92%}.dev-phone .pad{padding:14px}.dev-phone .thumb{height:92px}.dev-phone .thumb svg{height:70px}
.dev-phone .top .chip.pur{font-size:0!important;padding:7px!important}
.dev-phone .hint{flex-wrap:wrap}.dev-phone .hint>.grow,.dev-phone .hint>div:not(.icb):not(.thumb):not(.num):not(.ava):not(.toggle){flex:1 1 58%;min-width:0}
.dev-phone .card.pad.row{flex-wrap:wrap;gap:12px!important}.dev-phone .card.pad.row>.thumb{width:64px!important;height:64px!important}.dev-phone .card.pad.row>.thumb svg{height:46px}
.dev-phone .card.pad.row>.grow{flex:1 1 60%}.dev-phone .card.pad.row>.col:last-child{flex:1 1 100%}.dev-phone .card.pad.row>.col:last-child .btn{width:100%}
.dev-phone td .row,.dev-phone .rail,.dev-phone .seg{flex-wrap:nowrap}
.dev-phone .flow{font-size:11px}.dev-phone .bub{max-width:86%}
/* ---- Giáo trình, soạn bài, import ---- */
#app[data-fit] .screen{grid-template-rows:minmax(0,1fr)}#app[data-fit] .main{min-height:0}
.ditem{gap:10px}.ditem.hl{border-color:var(--org);box-shadow:0 0 0 3px rgba(240,82,43,.16),var(--sh)}
.sol{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);display:flex;flex-direction:column;gap:7px;font-size:12.8px}
.sol .why{color:var(--muted);font-size:12px;margin-top:1px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.grp .lbl{margin:0;flex-basis:100%}
.grp .chip{padding:6px 11px;font-size:12px}
.unc{background:#FFE9A8;border:1.5px dashed #E8A200;border-radius:6px;padding:0 4px;font:inherit;color:#7A5200;font-weight:700;outline:none}
.okc{background:var(--grn-s);color:var(--grn);border-radius:6px;padding:0 5px;font-weight:700;font-family:'Be Vietnam Pro',sans-serif;font-size:12px}
.tick{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--grn);color:#fff;vertical-align:middle;margin-left:3px}
.tick svg.ic{width:13px;height:13px;stroke-width:3}
.nb{text-align:left;width:150px;height:190px;border-radius:8px;border:1px solid #E3DAC0;background:repeating-linear-gradient(#FFFDF6 0 15px,#D5DFF3 15px 16px);position:relative;padding:15px 8px 6px 22px;font:8.5px/16px 'Bradley Hand','Comic Sans MS',cursive;color:#2B3A67;overflow:hidden;box-shadow:var(--sh)}
.nb::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:1px;background:#F2A9A0}
.nb svg{position:absolute;right:8px;bottom:8px;height:62px;opacity:.75}
.dz{border:2px dashed #C9D3F5;border-radius:16px;background:#F8FAFF;padding:26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.strike{text-decoration:line-through;color:var(--faint)}
/* ---- Soạn bài giảng, import bài giảng, hội thoại hai chiều (PO-45, PO-46) ---- */
.prop{border:1.5px dashed #B9A4FF;background:#FAF8FF;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ba{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 9px;font-size:12.8px;line-height:1.5}
.ba .tg{font-size:11px;font-weight:800;color:var(--muted);padding-top:5px}
.ba .bf{background:var(--red-s);color:#8A2A1A;text-decoration:line-through;text-decoration-color:rgba(138,42,26,.4);border-radius:8px;padding:5px 9px}
.ba .af{background:var(--grn-s);color:#0B5E41;border-radius:8px;padding:5px 9px;font-weight:600}
.uncn{display:flex;gap:7px;align-items:flex-start;font-size:12.3px;font-weight:600;line-height:1.45;color:#7A5200;background:var(--yel-s);border-radius:9px;padding:6px 9px}
.uncn svg.ic{width:14px;height:14px;flex-shrink:0;margin-top:2px}
.ed{border-radius:5px;outline:none;cursor:text;transition:background .12s,box-shadow .12s}.ed:hover{background:#FFF7DB}.ed:focus{background:#fff;box-shadow:0 0 0 2px var(--pri)}
.chkl{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--grn)}.chkl.bad{color:#9A6B00}.chkl svg.ic{width:14px;height:14px;flex-shrink:0}
.histp{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-height:172px;overflow-y:auto;flex-shrink:0}
.cbx{width:22px;height:22px;border-radius:7px;border:2px solid #B9C2D8;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:#fff;color:#fff}
.cbx.on{background:var(--pri);border-color:var(--pri)}.cbx svg.ic{width:14px;height:14px;stroke-width:3}
.ditem.off>.lbody,.ditem.off>.lexd{opacity:.42}
.lex,.lexd{background:var(--yel-s);border-radius:10px;padding:8px 11px;clear:both}.lexd{font-size:13.2px;line-height:1.6}
.ldraft{font-size:13.2px}.ldraft .lfig{width:150px}
.bub .opt{cursor:pointer;white-space:normal;border-radius:12px;text-align:left;background:#fff;border:1.5px solid #C9B8FF}
.tabs span[data-act]{cursor:pointer}
.dev-phone .modal .row{flex-wrap:wrap}.dev-phone .modal .row>*{flex:1 1 100%!important;width:auto!important}
/* ---- Hình 3D tương tác (PO-35, PO-36), từ khóa và bài giảng (PO-34), nguồn câu trả lời (PO-33) ---- */
.f3box{width:100%;height:100%}
.canvas .f3-hud{right:150px}.dev-phone .canvas .f3-hud,.canvas.noviews .f3-hud{right:8px}
.views span[data-act]{cursor:pointer}.views span[data-act]:hover{background:#EEF1F8}
.fnote{position:absolute;left:14px;bottom:16px;display:flex;gap:7px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:7px 11px}
.fnote svg.ic{width:15px;height:15px}
.meas span.hid{border-color:#B9C2D8;color:var(--muted);border-style:dashed}
.kw{color:#6238D9;font-weight:700;text-decoration:underline dotted #A98BFF;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;padding:8px 2px;margin:-8px -2px;border-radius:4px;transition:background .12s}
.kw:hover{background:var(--pur-s)}
.kw.go{color:var(--pri);text-decoration-color:#9DB0F5;white-space:nowrap}
.srcl{display:flex;gap:6px;align-items:flex-start;margin-top:8px;padding-top:7px;border-top:1px dashed #CFC2FA;font-size:11.5px;font-weight:600;color:#5B3FC4;line-height:1.45;flex-wrap:wrap}
.srcl[data-act]{cursor:pointer}.srcl[data-act]:hover u{background:var(--pur-s)}
.srcl svg.ic{width:13px;height:13px;flex-shrink:0;margin-top:2px}.srcl>span{flex:1 1 150px;min-width:0}.srcl u{text-decoration:underline dotted;text-underline-offset:3px}
.srcl.off{color:var(--muted);border-top-color:var(--line)}
.srcl .chip{font-size:10.5px;padding:2px 8px;flex:none;margin-right:auto}
.hsw .bub.ai{max-width:316px}.hsw .bub.me{max-width:290px}
.qs .chip{white-space:normal;border-radius:12px;text-align:left;padding:6px 10px}
.modal.lec{width:600px;max-width:94%;max-height:90%;overflow-y:auto;gap:12px}
.lrow{display:flex;gap:11px;align-items:center}
.lsrc{display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.45;background:var(--pri-s);color:#2F49B5}
.lsrc.ai{background:var(--pur-s);color:#5B3FC4}.lsrc svg.ic{width:17px;height:17px;flex-shrink:0}.lsrc>div{flex:1 1 220px;min-width:0;word-break:break-word}
.lbody{font-size:13.8px;line-height:1.62}.lbody p{margin:0 0 9px}.lbody p:last-child{margin-bottom:0}
.lfig{float:right;width:168px;margin:2px 0 8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:6px}.lfig svg{display:block;width:100%;height:auto}
.lrel{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.lrel .kw{font-size:13px;padding:10px 2px;margin:-4px 0}
.dev-phone .lfig{width:128px}.dev-phone .modal.lec{padding:18px}
.dev-phone .body>.canvas.c3d{height:520px!important}.dev-phone .f3-chip{min-height:36px;padding:0 10px;font-size:12px}.dev-phone .f3-hud{font-size:11.5px}
.dev-phone .meas span:not(:last-child){display:none}.dev-phone .fnote{bottom:10px;left:10px;right:10px}
</style>
</head>
<body>
<div id="demo"></div>
<div id="app"></div>

<script>
/* ============ DỮ LIỆU MẪU ============ */
const PROBS=[
 {id:'p1',short:'Hình chóp S.ABCD: góc giữa SD và mặt đáy',t:'Cho hình chóp S.ABCD, đáy là hình vuông cạnh a, SA ⊥ (ABCD), SA = a. Tính góc giữa SD và mặt đáy.',lv:'THPT',topic:'Góc',shape:'chop',c:'#3B5BDB',ok:1,ans:'45°',
  hints:['Góc giữa đường thẳng và mặt phẳng là góc giữa đường đó và hình chiếu của nó trên mặt phẳng.','Hình chiếu của S lên mặt đáy là điểm nào? Từ đó suy ra hình chiếu của SD.'],
  steps:[['Tìm hình chiếu của SD','SA ⊥ (ABCD) nên A là hình chiếu của S. Hình chiếu của SD là AD.','Muốn tìm góc giữa đường và mặt, việc đầu tiên là tìm hình chiếu của đường lên mặt.'],['Xác định góc cần tìm','Góc giữa SD và (ABCD) là góc SDA. Tam giác SAD vuông tại A.','Có hình chiếu rồi thì góc cần tìm nằm trong một tam giác vuông.'],['Tính góc','tan SDA = SA / AD = a / a = 1, suy ra góc SDA = 45°.','Trong tam giác vuông, tan của góc nhọn bằng cạnh đối chia cạnh kề.']]},
 {id:'p2',short:'Hình lập phương cạnh a: khoảng cách giữa AC và B′D′',t:'Cho hình lập phương ABCD.A′B′C′D′ cạnh a. Tính khoảng cách giữa AC và B′D′.',lv:'THPT',topic:'Khoảng cách',shape:'hop',c:'#F0522B',ok:1,ans:'a',
  hints:['AC và B′D′ nằm trong hai mặt đáy (ABCD) và (A′B′C′D′). Hai mặt này có quan hệ gì?','Khoảng cách giữa hai đường chéo nhau nằm trong hai mặt phẳng song song bằng khoảng cách giữa hai mặt phẳng đó.'],
  steps:[['Nhận xét vị trí','AC ⊂ (ABCD), B′D′ ⊂ (A′B′C′D′), và hai mặt phẳng này song song.','Hai đường chéo nhau thường được đưa về hai mặt phẳng song song chứa chúng.'],['Tính khoảng cách','Khoảng cách giữa hai mặt đáy bằng cạnh a. Vậy d(AC, B′D′) = a.','Đoạn nối tâm hai đáy vuông góc với cả AC và B′D′.']]},
 {id:'p3',short:'Lăng trụ đứng tam giác đều: tính thể tích',t:'Lăng trụ đứng tam giác có đáy là tam giác đều cạnh 4 cm, chiều cao 6 cm. Tính thể tích.',lv:'THCS',topic:'Thể tích',shape:'lang',c:'#0F8A5F',ok:1,ans:'24√3 cm³',
  hints:['Thể tích lăng trụ bằng diện tích đáy nhân chiều cao.','Diện tích tam giác đều cạnh a là a²√3 / 4.'],
  steps:[['Tính diện tích đáy','S = 4²·√3 / 4 = 4√3 cm².','Đáy là tam giác đều nên dùng công thức a²√3 / 4.'],['Tính thể tích','V = S · h = 4√3 · 6 = 24√3 cm³.','Lăng trụ đứng: V = diện tích đáy × chiều cao.']]},
 {id:'p4',short:'Hình nón: diện tích xung quanh và thể tích',t:'Hình nón có bán kính đáy 3 cm, đường sinh 5 cm. Tính diện tích xung quanh và thể tích.',lv:'THCS',topic:'Thể tích',shape:'non',c:'#7C4DFF',ok:1,ans:'15π cm², 12π cm³',
  hints:['Diện tích xung quanh hình nón: πrl.','Chiều cao tính từ tam giác vuông tạo bởi bán kính, chiều cao, đường sinh.'],
  steps:[['Diện tích xung quanh','Sxq = π·3·5 = 15π cm².','Công thức πrl với l là đường sinh.'],['Thể tích','h = √(5² − 3²) = 4. V = ⅓·π·3²·4 = 12π cm³.','Cần chiều cao trước khi tính thể tích.']]},
 {id:'p5',short:'Hình trụ: diện tích toàn phần',t:'Hình trụ có chiều cao 10 cm, bán kính đáy 4 cm. Tính diện tích toàn phần.',lv:'THCS',topic:'Diện tích',shape:'tru',c:'#0EA5E9',ok:1,ans:'112π cm²',
  hints:['Diện tích toàn phần gồm diện tích xung quanh và hai đáy.','Stp = 2πr(r + h).'],
  steps:[['Áp dụng công thức','Stp = 2π·4·(4 + 10) = 112π cm².','Gộp diện tích xung quanh 2πrh và hai đáy 2πr².']]},
 {id:'p6',short:'Mặt cầu ngoại tiếp hình lập phương',t:'Mặt cầu ngoại tiếp hình lập phương cạnh a. Tính bán kính và thể tích khối cầu.',lv:'THPT',topic:'Mặt cầu',shape:'cau',c:'#E8A200',ok:0,ans:'R = a√3/2',

  sum:'Đường thẳng d vuông góc với mặt phẳng (P) khi d vuông góc với hai đường thẳng cắt nhau nằm trong (P). Khi đó d vuông góc với mọi đường thẳng trong (P).',
  more:'Em nhìn cột cờ dựng trên sân: cột vuông góc với mọi vạch kẻ trên sân, dù vạch đó có đi qua chân cột hay không. Trong bài, dữ kiện có dấu ⊥ với một mặt phẳng cho em ngay các góc vuông để dùng.'},
 hc:{t:'Hình chiếu vuông góc',src:'gv',sec:'mục 1.2',les:'l1',q:'Hình chiếu vuông góc là gì?',rel:['gdm','dvm'],
  terms:['hình chiếu vuông góc','hình chiếu'],
  body:['Cho mặt phẳng (P) và điểm M không nằm trên (P). Qua M kẻ đường thẳng vuông góc với (P), cắt (P) tại H. Điểm H gọi là hình chiếu vuông góc của M trên (P). Nếu M đã nằm trên (P) thì hình chiếu của M là chính nó.',
   'Muốn tìm hình chiếu của một đoạn thẳng MN trên (P), ta tìm hình chiếu H của M và K của N, rồi nối HK. Trường hợp hay gặp: N đã nằm trên (P), khi đó hình chiếu của MN là đoạn HN.',
   'Cách nhận ra nhanh: nếu trong đề có một đường thẳng đi qua M và vuông góc với (P), thì chân của đường thẳng đó trên (P) chính là hình chiếu của M.'],
  sum:'Hình chiếu vuông góc của điểm M trên mặt phẳng (P) là chân H của đường vuông góc hạ từ M xuống (P). Hình chiếu của một đoạn thẳng là đoạn nối hình chiếu của hai đầu mút.',
  more:'Em hình dung nắng chiếu thẳng đứng xuống sân: bóng của một điểm nằm ngay dưới điểm đó, và bóng của một cây sào là đoạn nối bóng của hai đầu sào. Trên hình của bài, hãy tìm đường thẳng nào đã vuông góc sẵn với mặt phẳng.'},
 gdm:{t:'Góc giữa đường thẳng và mặt phẳng',src:'gv',sec:'mục 1.3',les:'l1',q:'Góc giữa đường thẳng và mặt phẳng là gì?',rel:['hc','tslg','dvm'],
  terms:['góc giữa đường thẳng và mặt phẳng','góc giữa đường và mặt'],
  body:['Nếu đường thẳng d vuông góc với mặt phẳng (P) thì góc giữa d và (P) bằng 90°. Nếu không, góc giữa d và (P) là góc giữa d và hình chiếu vuông góc d′ của nó trên (P). Góc này luôn nằm trong khoảng từ 0° đến 90°.',
   'Ba việc cần làm: (1) tìm giao điểm I của d với (P); (2) lấy một điểm M khác trên d, tìm hình chiếu H của M trên (P), nối HI để được d′; (3) góc cần tìm là góc nhọn tại I.',
   'Góc đó nằm trong tam giác MHI, là một tam giác vuông tại H, nên tính được bằng tỉ số lượng giác.'],
  sum:'Góc giữa đường thẳng d và mặt phẳng (P) là góc giữa d và hình chiếu vuông góc của nó trên (P); góc này nằm trong khoảng từ 0° đến 90°.',
  more:'Làm theo ba việc: tìm giao điểm của đường thẳng với mặt phẳng, tìm hình chiếu của một điểm khác trên đường thẳng, rồi xét góc tại giao điểm trong tam giác vuông vừa tạo ra.'},
 tslg:{t:'Tỉ số lượng giác trong tam giác vuông',src:'ai',les:'l1',q:'Tỉ số lượng giác trong tam giác vuông tính thế nào?',rel:['gdm'],
  terms:['tỉ số lượng giác','tam giác vuông','tan của góc nhọn'],
  body:['Trong tam giác vuông, xét một góc nhọn α. Cạnh đối là cạnh góc vuông không chạm vào α, cạnh kề là cạnh góc vuông chạm vào α, cạnh huyền là cạnh đối diện với góc vuông.',
   'sin α = cạnh đối / cạnh huyền; cos α = cạnh kề / cạnh huyền; tan α = cạnh đối / cạnh kề.',
   'Khi biết hai cạnh góc vuông, dùng tan là nhanh nhất vì không cần tính cạnh huyền. Có giá trị của tan rồi, em tra bảng giá trị lượng giác của các góc đặc biệt hoặc dùng máy tính để suy ra số đo góc.',
   'Lưu ý: phải chỉ ra đúng tam giác vuông và đúng đỉnh góc vuông trước khi lập tỉ số.'],
  sum:'Trong tam giác vuông, với góc nhọn α: sin α = cạnh đối / cạnh huyền, cos α = cạnh kề / cạnh huyền, tan α = cạnh đối / cạnh kề.',
  more:'Trước khi lập tỉ số, em chỉ rõ đỉnh góc vuông, rồi đứng ở góc nhọn cần tính: cạnh góc vuông chạm vào góc đó là cạnh kề, cạnh góc vuông còn lại là cạnh đối. Biết hai cạnh góc vuông thì dùng tan.'},
 cheo:{t:'Hai đường thẳng chéo nhau',src:'ai',les:'l2',q:'Hai đường thẳng chéo nhau là gì?',rel:['kcss'],
  terms:['hai đường thẳng chéo nhau','hai đường chéo nhau','đường chéo nhau','chéo nhau'],
  body:['Hai đường thẳng chéo nhau là hai đường thẳng không cùng nằm trong một mặt phẳng nào: chúng không cắt nhau và cũng không song song.',
   'Khoảng cách giữa hai đường thẳng chéo nhau là độ dài đoạn vuông góc chung, tức đoạn thẳng nối hai đường và vuông góc với cả hai.',
   'Cách làm thường gặp: nếu hai đường chéo nhau lần lượt nằm trong hai mặt phẳng song song thì khoảng cách giữa hai đường bằng khoảng cách giữa hai mặt phẳng đó. Vì thế, việc đầu tiên là tìm hai mặt phẳng song song, mỗi mặt chứa một đường.'],
  sum:'Hai đường thẳng chéo nhau là hai đường không cùng nằm trong một mặt phẳng. Khoảng cách giữa chúng là độ dài đoạn vuông góc chung; nếu hai đường nằm trong hai mặt phẳng song song thì khoảng cách đó bằng khoảng cách giữa hai mặt phẳng.',
  more:'Hai đường chéo nhau giống một cây cầu vượt và con đường chạy bên dưới: không gặp nhau, cũng không song song. Việc đầu tiên là tìm hai mặt phẳng song song, mỗi mặt chứa một đường.'},
 kcss:{t:'Khoảng cách giữa hai mặt phẳng song song',src:'gv',sec:'mục 2.2',les:'l2',q:'Khoảng cách giữa hai mặt phẳng song song tính thế nào?',rel:['cheo','dvm'],
  terms:['khoảng cách giữa hai mặt phẳng song song','khoảng cách giữa hai mặt phẳng','hai mặt phẳng song song','mặt phẳng song song'],
  body:['Cho hai mặt phẳng song song (P) và (Q). Khoảng cách giữa chúng là khoảng cách từ một điểm bất kì trên (P) đến (Q). Kết quả không phụ thuộc vào điểm được chọn.',
   'Để tính, chọn một điểm M thuận tiện trên (P), hạ đường vuông góc MH xuống (Q); độ dài MH là khoảng cách cần tìm.',
   'Nếu trên hình đã có sẵn một đường thẳng vuông góc với mặt phẳng (P) và (Q), thì đoạn của nó nằm giữa hai mặt phẳng chính là MH, không cần dựng thêm.'],
  sum:'Khoảng cách giữa hai mặt phẳng song song là khoảng cách từ một điểm bất kì của mặt phẳng này đến mặt phẳng kia.',
  more:'Giống khoảng cách giữa sàn và trần của một căn phòng: đo ở chỗ nào cũng ra cùng một số, miễn là đo theo phương vuông góc. Em tìm một đoạn thẳng vuông góc với cả hai mặt phẳng.'},
 ttlt:{t:'Thể tích khối lăng trụ',src:'gv',sec:'mục 3.1',les:'l3',q:'Thể tích khối lăng trụ tính thế nào?',rel:['kcss','dttp'],
  terms:['thể tích khối lăng trụ','thể tích lăng trụ','lăng trụ đứng'],
  body:['Thể tích khối lăng trụ bằng diện tích đáy nhân với chiều cao: V = S · h. Chiều cao là khoảng cách giữa hai mặt đáy; với lăng trụ đứng, chiều cao bằng độ dài cạnh bên.',
   'Diện tích đáy tính theo hình dạng của đáy. Một số công thức hay dùng: tam giác đều cạnh a có S = a²√3/4; tam giác vuông có S bằng nửa tích hai cạnh góc vuông; hình chữ nhật có S bằng dài nhân rộng.',
   'Nhớ kiểm tra đơn vị: diện tích đáy tính bằng cm² và chiều cao tính bằng cm thì thể tích tính bằng cm³.'],
  sum:'Thể tích khối lăng trụ bằng diện tích đáy nhân với chiều cao: V = S · h. Với lăng trụ đứng, chiều cao bằng độ dài cạnh bên.',
  more:'Em tính riêng diện tích đáy trước, viết kèm đơn vị, rồi mới nhân với chiều cao. Đáy là hình gì thì dùng công thức diện tích của hình đó.'},
 sxqn:{t:'Diện tích xung quanh hình nón',src:'gv',sec:'mục 4.1',les:'l4',q:'Diện tích xung quanh hình nón tính thế nào?',rel:['tslg','dttp'],
  terms:['diện tích xung quanh hình nón','diện tích xung quanh','đường sinh'],
  body:['Hình nón có bán kính đáy r, chiều cao h và đường sinh l. Đường sinh là đoạn nối đỉnh với một điểm trên đường tròn đáy; chiều cao là đoạn nối đỉnh với tâm đáy. Ba đoạn r, h, l tạo thành một tam giác vuông, nên l² = r² + h².',
   'Diện tích xung quanh: Sxq = πrl. Diện tích toàn phần: Stp = πrl + πr². Thể tích: V = ⅓πr²h.',
   'Lỗi hay gặp: dùng đường sinh thay cho chiều cao trong công thức thể tích. Nếu đề cho r và l, phải tính h trước rồi mới tính thể tích.'],
  sum:'Hình nón có bán kính đáy r, chiều cao h, đường sinh l với l² = r² + h². Diện tích xung quanh là Sxq = πrl; thể tích là V = ⅓πr²h.',
  more:'Đường sinh là cạnh xiên chạy trên mặt nón, chiều cao là đoạn thẳng đứng từ đỉnh xuống tâm đáy. Hai đoạn này cùng với bán kính tạo thành một tam giác vuông, nên biết hai đại lượng là tính được đại lượng thứ ba.'},
 dttp:{t:'Diện tích toàn phần hình trụ',src:'gv',sec:'mục 4.2',les:'l4',q:'Diện tích toàn phần hình trụ tính thế nào?',rel:['sxqn'],
  terms:['diện tích toàn phần hình trụ','diện tích toàn phần'],
  body:['Hình trụ có bán kính đáy r và chiều cao h. Mặt xung quanh khi trải phẳng là một hình chữ nhật có một cạnh bằng chu vi đáy 2πr và cạnh kia bằng h, nên Sxq = 2πrh.',
   'Diện tích toàn phần gồm diện tích xung quanh và diện tích hai đáy: Stp = 2πrh + 2πr² = 2πr(r + h).',
   'Thể tích: V = πr²h. Khi làm bài, viết công thức trước, thay số sau, và giữ nguyên π trong kết quả nếu đề không yêu cầu làm tròn.'],
  sum:'Diện tích toàn phần của hình trụ gồm diện tích xung quanh và hai đáy: Stp = 2πrh + 2πr² = 2πr(r + h).',
  more:'Em tưởng tượng bóc nhãn một hộp sữa hình trụ: tờ nhãn trải ra là hình chữ nhật có chiều dài bằng chu vi đáy. Cộng thêm hai nắp tròn là được diện tích toàn phần.'},
 mcnt:{t:'Mặt cầu ngoại tiếp',src:'ai',les:'l4',q:'Mặt cầu ngoại tiếp là gì?',rel:['tslg'],
  terms:['mặt cầu ngoại tiếp','tâm mặt cầu'],
  body:['Mặt cầu ngoại tiếp một hình đa diện là mặt cầu đi qua tất cả các đỉnh của hình đó. Tâm của mặt cầu cách đều mọi đỉnh; khoảng cách đó là bán kính R.',
   'Với hình hộp chữ nhật (hình lập phương là trường hợp riêng), các đường chéo cắt nhau tại trung điểm của mỗi đường. Điểm đó cách đều tám đỉnh nên là tâm mặt cầu ngoại tiếp, và R bằng nửa độ dài đường chéo. Hình hộp chữ nhật có ba kích thước m, n, p thì đường chéo dài √(m² + n² + p²), tính bằng định lí Pythagore trong hai tam giác vuông.',
   'Khi đã có R: diện tích mặt cầu S = 4πR², thể tích khối cầu V = 4/3·πR³.'],
  sum:'Mặt cầu ngoại tiếp một hình đa diện đi qua tất cả các đỉnh của hình đó; tâm mặt cầu cách đều các đỉnh. Với hình hộp chữ nhật, tâm là giao điểm các đường chéo và bán kính bằng nửa đường chéo.',
  more:'Em tìm một điểm cách đều tất cả các đỉnh. Ở hình hộp chữ nhật, các đường chéo cắt nhau tại trung điểm của mỗi đường nên điểm đó chính là tâm; việc còn lại là tính độ dài đường chéo.'}};

 <div class="card pad col" style="gap:12px"><h2 style="margin:0">Em đang học tới đâu</h2>${[['Góc','#3B5BDB',70],['Khoảng cách','#F0522B',35],['Thể tích','#0F8A5F',85]].map(x=>`<div><div class="row small" style="margin-bottom:5px"><b>${x[0]}</b><span class="muted" style="margin-left:auto">${x[2]}%</span></div><div class="bar"><i style="width:${x[2]}%;background:${x[1]}"></i></div></div>`).join('')}</div>
 <div class="card pad col" style="gap:10px"><h2 style="margin:0">Tự khám phá</h2><div class="small muted">Dán đề của em hoặc chọn một hình mẫu.</div><span class="btn soft" data-go="hs-self">${ic('cube')}Mở chế độ tự học</span></div></div>`),

'hs-work':()=>{const a=A(),p=PB(a.p),v=VA(a),nH=v.hints.length,sN=stateOf(a),isSol=st.tab==='sol'&&a.open,f3=FIGP(p.id);
 if(st.step>=v.steps.length)st.step=0;
 const tabs=`<div class="tabs">${[['hint','bulb','Gợi ý'],['sol',a.open?'unlock':'lock','Lời giải'],['chat','chat','Hỏi đáp']].map(t=>`<span class="${st.tab===t[0]?'on':''}" data-act="tab" data-arg="${t[0]}">${ic(t[1])}${t[2]}</span>`).join('')}</div>`;
 const kwTip=`<div class="tiny muted" data-part="kwtip">Chữ <span class="kw" style="cursor:default">gạch chân chấm</span> là từ khóa: bấm để đọc lại bài giảng.</div>`;
 let side='';
 if(st.tab==='hint')side=`<div><div class="row small" style="margin-bottom:6px"><b>Tiến độ của em</b><span class="muted" style="margin-left:auto">${sN}/${nH+1}</span></div><div class="steps">${Array.from({length:nH+1},(_,i)=>`<i class="${i<sN?'on':''}"></i>`).join('')}</div></div>
  ${a.hints===0?`<div class="hint" style="background:var(--soft)"><div class="icb pri">${ic('cube')}</div><div><h3>Thử tự làm trước nhé</h3><p>${f3?'Kéo trên hình để xoay, dùng công cụ bên dưới để vẽ thêm và đo.':'Đọc kỹ đề và quan sát hình.'} Khi cần, bấm nút để xem gợi ý đầu tiên.</p></div></div>`:''}
  ${v.hints.slice(0,a.hints).map((h,i)=>`<div class="hint ${i===a.hints-1?'act':''}"><div class="icb yel">${ic('bulb')}</div><div><h3>Gợi ý${nH>1?' '+(i+1):''} · ${i?'Bước kế tiếp':'Hướng nghĩ'}</h3><p>${kw(h)}</p></div></div>`).join('')}
  ${a.hints>0?kwTip:''}
  ${a.hints<nH?`<span class="btn" data-act="hint">${ic('bulb')}Xem gợi ý${nH>1?' '+(a.hints+1):''}</span>`:''}
  ${a.open?`<div class="hint" style="border-color:#B9E6D2;background:var(--grn-s);align-items:center" data-act="tab" data-arg="sol"><div class="icb grn">${ic('unlock')}</div><div><h3>Lời giải đã mở</h3><p>Bấm để xem từng bước cùng hình.</p></div></div>`
   :a.self?`<div class="hint lock" style="align-items:center"><div class="icb" style="background:#E7EBF4;color:var(--muted)">${ic('lock')}</div><div><h3>Lời giải mở sau gợi ý ${nH}</h3><p>Ở chế độ tự học, em xem hai gợi ý trước.</p></div></div>`
   :`<div class="hint lock" style="align-items:center"><div class="icb" style="background:#E7EBF4;color:var(--muted)">${ic('lock')}</div><div><h3>Lời giải mở ${a.rel}</h3><p>Do giáo viên của em đặt.</p></div></div>`}`;
 else if(st.tab==='sol')side=!a.open?`<div class="col" style="align-items:center;text-align:center;gap:12px;margin-top:40px"><div class="icb yel" style="width:84px;height:84px;border-radius:26px">${ic('lock','width:40px;height:40px')}</div><h2 style="margin:0;font-size:19px">Lời giải đang khóa</h2><div class="muted">Mở ${a.self?'sau khi em xem gợi ý '+nH:a.rel+', do giáo viên của em đặt'}.</div>
   ${v.steps.map(()=>`<div class="hint" style="width:100%;opacity:.5"><div class="num">?</div><div class="grow"><div style="height:11px;width:60%;background:#E7EBF4;border-radius:9px"></div><div style="height:9px;width:92%;background:#EEF1F7;border-radius:9px;margin-top:8px"></div></div></div>`).join('')}
   <span class="btn soft" data-act="tab" data-arg="hint">${ic('bulb')}Xem gợi ý trong lúc chờ</span></div>`
  :`<div class="row"><span class="chip ${p.ok?'grn':'yel'}">${ic('shield')}${p.ok?'Đáp số đã kiểm chứng':'Cần xem lại'}</span><span class="chip pur">${ic('spark')}AI soạn</span></div>
   ${v.steps.map((s,i)=>`<div class="hint ${i===st.step?'act':''}" data-act="step" data-arg="${i}"><div class="num ${i<st.step?'done':i===st.step?'on':''}">${i+1}</div><div><h3>${s[0]}</h3><p>${kw(s[1])}</p>${i===st.step&&v.fmt!=='short'?`<div class="small" style="margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff;border:1px dashed #C9D3F5"><b style="color:var(--pri)">Vì sao nghĩ ra bước này?</b> ${kw(s[2])}</div>`:''}</div></div>`).join('')}
   ${f3?`<div class="tiny muted" data-part="steptip">Phần vẽ thêm của bước đang xem hiện dần trên hình; các bước trước mờ đi.</div>`:''}
   <div class="grow"></div><div class="row"><span class="btn ghost grow" data-act="step" data-arg="${Math.max(0,st.step-1)}">${ic('arrow','transform:rotate(180deg)')}Bước trước</span><span class="btn grow" data-act="step" data-arg="${Math.min(v.steps.length-1,st.step+1)}">Bước sau${ic('arrow')}</span></div>`;
 else side=`<div class="col grow scroll end" style="gap:9px"><div class="bub ai">Em cứ hỏi về bài này. Mình trả lời dựa trên giáo trình của lớp và ghi rõ nguồn. ${a.open?'':'Trước giờ mở lời giải, mình chỉ giải thích khái niệm và gợi hướng, không nêu đáp số.'}</div>${a.chat.map(m=>bubHTML(m,a)).join('')}</div>
  <div class="row qs" style="gap:6px;flex-wrap:wrap">${QS(a).map(q=>`<span class="chip pri" data-act="ask" data-arg="${q}">${q}</span>`).join('')}</div>
  <div class="field" style="background:var(--soft)">${ic('chat')}<input class="in" id="q" placeholder="Hỏi về bài này…"><div class="icb pri" style="width:32px;height:32px" data-act="ask">${ic('send','width:16px;height:16px')}</div></div>`;
 return shell(p.short,a.self?'Tự học':'Bài được giao · lớp '+a.cls,`
<div class="canvas ${f3?'c3d':'noviews'}"><div class="prob"><div class="icb pri">${ic('file')}</div><div class="grow">${VA(a).t}</div><span class="chip ${p.ok?'grn':'yel'}">${ic('shield')}${p.ok?'Hình đã kiểm chứng':'Cần xem lại'}</span></div>
 <div class="fig">${f3?figBox(p.id,a.id):figStatic(p,'78%')}</div>
 ${f3?`<div class="views"><span data-act="view" data-arg="front">${ic('eye')}Nhìn từ trước</span><span data-act="view" data-arg="top">${ic('layers')}Nhìn từ trên</span><span data-act="view" data-arg="default">${ic('cube')}Xoay tự do</span></div>
 <div class="meas" style="bottom:96px">${measHTML(a)}</div>${dockI((st.figs[a.id]&&st.figs[a.id].tool)||'select')}`
 :`<div class="fnote">${ic('cube')}Hình tĩnh: bài này chưa có hình tương tác trong bản mẫu.</div>`}</div>
<div class="card side hsw">${tabs}<div class="pad col grow" style="gap:11px;min-height:0">${side}</div></div>`,{top:`<span class="btn sm ghost" data-go="hs-home">${ic('arrow','transform:rotate(180deg)')}Bài của em</span>`});},

'hs-self':()=>shell('Tự học','Dán đề của em, hoặc chọn một hình để khám phá',`
<div class="col grow" style="gap:14px;min-width:0">
 ${flow('Nhập đề → bấm <i>Dựng hình</i> → hệ thống đọc đề, dựng hình, kiểm chứng → mở màn hình làm bài.')}
 <div class="card pad col" style="gap:12px"><div class="row"><div class="icb pri">${ic('edit')}</div><h2 style="margin:0">Đề bài của em</h2></div>
  <div class="field" style="align-items:flex-start;height:104px;font-weight:500"><textarea class="in" id="selfq" style="height:100%">Mặt cầu ngoại tiếp hình lập phương cạnh a. Tính bán kính và thể tích khối cầu.</textarea></div>
  <div class="row"><span class="btn ghost" data-act="toastx" data-arg="Bản mẫu: ảnh đề sẽ được đọc thành chữ để em sửa lại">${ic('camera')}Chụp hoặc dán ảnh đề</span><span class="btn" style="margin-left:auto;padding:11px 22px" data-act="build">${ic('spark')}Dựng hình</span></div></div>
 <div class="card pad"><h2>Hoặc chọn một hình mẫu</h2><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">${PROBS.map(p=>`<div class="col" style="gap:7px;align-items:center" data-act="selfp" data-arg="${p.id}"><div class="thumb" style="width:100%;height:120px">${sh[p.shape](p.c)}</div><b class="small">${{chop:'Hình chóp',hop:'Hình hộp',lang:'Lăng trụ',non:'Hình nón',tru:'Hình trụ',cau:'Hình cầu'}[p.shape]}</b></div>`).join('')}</div></div></div>`),

'hs-loading':()=>shell('Đang dựng hình…','Tự học',`<div class="card pad col grow" style="align-items:center;justify-content:center;gap:16px">
 <div class="spin" style="width:60px;height:60px"></div>
 ${['Đọc đề bài','Dựng hình từ điều kiện của đề','Kiểm chứng bằng tính toán','Soạn gợi ý từng mức'].map((t,i)=>`<div class="row" style="width:360px"><div class="num ${i<st.load?'done':i===st.load?'on':''}">${i<st.load?ic('check','width:14px;height:14px;stroke-width:3'):i+1}</div><b style="${i>st.load?'color:var(--faint)':''}">${t}</b></div>`).join('')}</div>`),

'hs-history':()=>shell('Lịch sử','Bài em đã làm và câu em đã hỏi',`
<div class="card pad col grow" style="gap:10px"><h2 style="margin:0">Bài đã làm</h2>${st.asg.map(a=>{const p=PB(a.p);return `<div class="hint" style="align-items:center" data-act="open" data-arg="${a.id}"><div class="thumb" style="width:58px;height:58px;flex-shrink:0">${sh[p.shape](p.c).replace('<svg','<svg style="height:42px"')}</div><div class="grow"><h3>${p.short}</h3><p>${a.self?'Tự học':'Lớp '+a.cls} · ${a.hints} gợi ý · ${a.chat.filter(m=>m.me).length} câu hỏi</p></div><span class="chip ${a.seen?'grn':'yel'}">${a.seen?'Đã xem lời giải':'Đang làm'}</span></div>`}).join('')}</div>
<div class="card pad col" style="width:420px;flex-shrink:0;gap:10px"><h2 style="margin:0">Nhật ký hỏi đáp</h2>${st.asg.flatMap(a=>a.chat.filter(m=>m.me).map(m=>`<div class="hint"><div class="icb pur">${ic('chat')}</div><div><h3>"${m.t}"</h3><p>${PB(a.p).short}</p></div></div>`)).join('')||'<div class="muted small">Em chưa hỏi câu nào. Vào một bài và mở tab Hỏi đáp.</div>'}</div>`),

'hs-group':()=>shell('Nhóm học: Hình không gian 11','Chặng 7 · nhóm liên trường · có giáo viên điều phối',bodyOf(V7).replace(/<div class="pad col grow" style="gap:12px">[\s\S]*$/,`<div class="pad col grow" style="gap:10px;min-height:0"><div class="col grow scroll end" style="gap:9px">${st.grp.map(m=>`<div class="bub ${m[0]==='An'?'me':m[0]==='Trợ lý nhóm'?'ai':'ot'}"><b class="tiny">${m[0]}</b><br>${m[2]}</div>`).join('')}</div>
 <div class="field" style="background:var(--soft)">${ic('chat')}<input class="in" id="gq" placeholder="Nhắn cả nhóm…" value="${st.grp.length<3?'Vậy kẻ AH ⊥ SO là xong đúng không?':''}"><div class="icb pri" style="width:32px;height:32px" data-act="gsend">${ic('send','width:16px;height:16px')}</div></div>
 <div class="row tiny muted"><span class="chip red" data-act="toastx" data-arg="Đã gửi báo cáo tới giáo viên điều phối">${ic('flag')}Báo cáo</span><span>Giáo viên điều phối theo dõi trao đổi.</span></div></div></div>`)),

'hs-subject':()=>{const a=st.pa;const pts=Array.from({length:41},(_,i)=>{const x=-4+i*.2,y=a*x*x-2;return `${220+x*40},${200-y*24}`}).join(' ');
 return shell(st.subj==='phang'?'Hình học phẳng':'Hàm số và đồ thị',st.subj==='phang'?'Chặng 2 · trọn môn Hình học':'Chặng 4 · môn học thứ hai dùng lại khung môn học',`
<div class="canvas"><div class="prob"><div class="icb pri">${ic('file')}</div><div class="grow">${st.subj==='phang'?'Cho tam giác ABC vuông tại A, AB = 3, AC = 4. Tính BC và đường cao AH.':'Khảo sát đồ thị hàm số y = ax² − 2. Kéo thanh trượt để xem a thay đổi đồ thị thế nào.'}</div><span class="chip grn">${ic('shield')}Đã kiểm chứng</span></div>
 <div class="fig">${st.subj==='phang'?`<svg viewBox="0 0 440 360"><polygon points="80,300 380,300 80,75" fill="#3B5BDB" fill-opacity=".1" stroke="#253150" stroke-width="2.6" stroke-linejoin="round"/><line x1="80" y1="300" x2="188" y2="219" stroke="#F0522B" stroke-width="3" stroke-dasharray="8 6"/><path d="M80,280h20v20" fill="none" stroke="#253150" stroke-width="2"/><g fill="#141B2D"><circle cx="80" cy="300" r="5"/><circle cx="380" cy="300" r="5"/><circle cx="80" cy="75" r="5"/></g><circle cx="188" cy="219" r="6" fill="#F0522B"/><g font-size="19" font-weight="800" fill="#141B2D"><text x="56" y="322">A</text><text x="388" y="322">C</text><text x="56" y="70">B</text></g><text x="198" y="212" fill="#F0522B" font-size="19" font-weight="800">H</text><g font-size="15" font-weight="700" fill="#5F6B85"><text x="50" y="194">3</text><text x="222" y="326">4</text><text x="236" y="176">5</text></g></svg>`
  :`<svg viewBox="0 0 440 360"><g stroke="#DCE2EF">${Array.from({length:11},(_,i)=>`<line x1="${20+i*40}" y1="20" x2="${20+i*40}" y2="340"/>`).join('')}${Array.from({length:8},(_,i)=>`<line x1="20" y1="${32+i*48}" x2="420" y2="${32+i*48}"/>`).join('')}</g><line x1="20" y1="200" x2="420" y2="200" stroke="#253150" stroke-width="2"/><line x1="220" y1="20" x2="220" y2="340" stroke="#253150" stroke-width="2"/><clipPath id="cp"><rect x="20" y="20" width="400" height="320"/></clipPath><polyline points="${pts}" fill="none" stroke="#F0522B" stroke-width="3.5" clip-path="url(#cp)"/><circle cx="220" cy="248" r="6" fill="#3B5BDB"/><text x="230" y="266" font-size="15" font-weight="800" fill="#3B5BDB">Đỉnh (0; −2)</text><text x="404" y="194" font-size="15" font-weight="700">x</text><text x="228" y="34" font-size="15" font-weight="700">y</text></svg>`}</div>
 <div class="views" style="top:90px"><span class="${st.subj==='phang'?'':''}" data-act="subj" data-arg="phang">${ic('layers')}Hình học phẳng</span><span data-act="subj" data-arg="hamso">${ic('chart')}Hàm số và đồ thị</span></div></div>
<div class="card side"><div class="tabs"><span class="on">${ic('bulb')}Gợi ý</span><span>${ic('lock')}Lời giải</span><span>${ic('chat')}Hỏi đáp</span></div><div class="pad col grow" style="gap:11px">
 ${st.subj==='phang'?`<div class="hint act"><div class="icb yel">${ic('bulb')}</div><div><h3>Gợi ý 1 · Hướng nghĩ</h3><p>Tam giác vuông: bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông.</p></div></div><div class="hint"><div class="icb yel">${ic('bulb')}</div><div><h3>Gợi ý 2 · Bước kế tiếp</h3><p>Tính diện tích tam giác theo hai cách để suy ra AH.</p></div></div>`
  :`<div class="hint act"><div class="icb pri">${ic('chart')}</div><div class="grow"><h3>Hệ số a = ${vn(a.toFixed(1))}</h3><p>${a>0?'a > 0: đồ thị quay bề lõm lên trên.':a<0?'a < 0: đồ thị quay bề lõm xuống dưới.':'a = 0: đồ thị là đường thẳng y = −2.'}</p><input type="range" min="-2" max="2" step="0.1" value="${a}" id="rng" style="margin-top:8px"></div></div><div class="hint"><div class="icb yel">${ic('bulb')}</div><div><h3>Thử xem</h3><p>Kéo a về số âm. Đỉnh của parabol có đổi chỗ không?</p></div></div>`}
 <div class="hint lock" style="align-items:center"><div class="icb" style="background:#E7EBF4;color:var(--muted)">${ic('lock')}</div><div><h3>Cùng một cách học</h3><p>Hình đã kiểm chứng, gợi ý trước, lời giải mở theo giờ giáo viên đặt.</p></div></div></div></div>`);},

/* ============ GIÁO VIÊN ============ */
'gv-home':()=>shell('Tổng quan','Giáo viên mẫu · 2 lớp',`
<div class="col grow scroll" style="gap:14px;min-width:0">
 <div class="row" style="gap:14px">${[['users','pri','2','lớp'],['book','org',String(48+st.libExtra),'đề trong kho'],['send','grn',String(st.asg.filter(a=>!a.self).length),'bài đang giao'],['lock','yel',String(st.asg.filter(a=>!a.open&&!a.self).length),'lời giải đang khóa']].map(x=>`<div class="card stat"><div class="icb ${x[1]}">${ic(x[0])}</div><div><b>${x[2]}</b><span class="small muted">${x[3]}</span></div></div>`).join('')}</div>
 <div class="card pad col" style="gap:10px"><h2 style="margin:0">Bài đang giao</h2>${st.asg.filter(a=>!a.self).map(a=>`<div class="hint" style="align-items:center" data-act="track" data-arg="${a.id}"><div class="thumb" style="width:58px;height:58px;flex-shrink:0">${sh[PB(a.p).shape](PB(a.p).c).replace('<svg','<svg style="height:42px"')}</div><div class="grow"><h3>${PB(a.p).short}</h3><p>Lớp ${a.cls}</p></div>${a.open?`<span class="chip grn">${ic('unlock')}Lời giải đã mở</span>`:`<span class="chip yel">${ic('lock')}Mở ${a.rel}</span>`}<span class="btn sm ghost">${ic('chart')}Theo dõi</span></div>`).join('')}</div>
 <div class="row" style="gap:14px"><div class="card pad row grow" data-go="gv-lib"><div class="icb pri">${ic('book')}</div><div><b>Mở kho đề</b><div class="small muted">Chọn đề và giao cho lớp</div></div></div><div class="card pad row grow" data-go="gv-copilot"><div class="icb pur">${ic('spark')}</div><div><b>Trợ lý soạn đề</b><div class="small muted">Chặng 5 · concept</div></div></div></div></div>

   else if(f!=='t'&&p.ans.split(', ').map(a=>a.replace(/^.*[=≈]\s*/,'')).some(a=>a.length>=2&&val.includes(a))){o.chkT='Máy kiểm lại sau khi thầy cô sửa: lời giải không đổi, nhưng gợi ý có nêu đáp số.';t=`Cảnh báo: ${fn} của ${N} vừa sửa có nêu đáp số (${p.ans}). Học sinh sẽ thấy đáp số trước giờ mở lời giải; thầy cô cân nhắc bỏ con số này.`;}
   else{o.chkT='Máy kiểm lại sau khi thầy cô sửa: đạt.';t=f==='t'?`Tôi đã kiểm lại đề ${N} sau khi thầy cô sửa: các dữ kiện không đổi nên lời giải và đáp số ${p.ans} vẫn đúng.`:`Tôi đã kiểm lại ${fn} của ${N} sau khi thầy cô sửa: gợi ý không nêu đáp số; lời giải và đáp số ${p.ans} không đổi.`;}}
  else if(!same){o.rev=1;o.chkT='Máy chưa kiểm lại được sau khi thầy cô sửa: cần xem lại.';t=`Thầy cô vừa đổi số liệu hoặc kí hiệu ở ${fn} của ${N}. Tôi chưa kiểm lại được nên chuyển nhãn máy sang “Cần xem lại”. Thầy cô hoàn tác được chỗ sửa này.`;}
  else{o.chkT='Máy kiểm lại sau khi thầy cô sửa: đạt.';t=`Tôi đã kiểm lại ${fn} của ${N} sau khi thầy cô sửa: số liệu và công thức không đổi, không có đáp số của bài tập nào.`;}
  ctx.hist.push({who:'gv',t:`${cap(N)}: sửa tay ${fn}`});ctx.chat.push({t,undo:1});if(k==='ex')ctx.last=+i;else ctx.llast=+i;render();},
 lpv:x=>{const[k,i]=x.split(',');st.lpv={k,i:+i};st.modal='lpv';render();},
 lsel:i=>{const d=st.imp.lecs[+i];d.sel=!d.sel;st.imp.llast=-1;render();},
 impgrp:g=>{st.imp.grp=g;st.imp.last=st.imp.llast=-1;render();},
 pv:x=>{const[k,i]=x.split(',');st.pv={k,i:+i,h:1};delete st.figs.pv;st.modal='pv';render();},
 pvhint:()=>{st.pv.h++;render();},
 impopen:src=>{st.imp=newImp(src);go('gv-import');},
 impsrc:src=>{const f=st.imp.fmt;st.imp=newImp(src);st.imp.fmt=f;render();},
 impfile:()=>{st.imp.file=!st.imp.file;render();},
 imppick:()=>{st.imp.imgs=IMGP.slice();render();},
 impmv:x=>{const[i,d]=x.split(',').map(Number),a=st.imp.imgs,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();},
 impdel:i=>{st.imp.imgs.splice(+i,1);render();},
 impfmt:f=>{st.imp.fmt=f;render();},
 imprun:()=>{const m=st.imp,img=m.src==='img';if(m.stage!=='pick')return;if(img?!m.imgs.length:!m.file)return toast(img?'Thầy cô chọn ảnh trước đã':'Thầy cô chọn tài liệu trước đã');
  m.stage='run';m.load=0;render();
  const tick=()=>{m.load++;if(m.load<4){render();return setTimeout(tick,550);}
   m.stage='done';m.items=(img?m.imgs:DOCP).map(p=>({p}));if(!img)m.lecs=DOCL.map(id=>{const L=LK(id);return{id,body:L.body.slice(),exT:L.exT||null,fig:L.fig!==false,sel:true};});const bad=m.items.filter(it=>!PB(it.p).ok).length,u=img?uncLeft():0;
   m.chat=[{t:`Tôi đọc được ${m.items.length} bài từ ${img?m.imgs.length+' ảnh':'tài liệu'}: ${m.items.length-bad} bài đã kiểm chứng${bad?`, ${bad} bài cần xem lại`:''}.${u?` Có ${u} chỗ chữ viết tay tôi chưa chắc, đã tô vàng để thầy cô sửa.`:''}${img?'':` Phần lý thuyết của giáo án tôi tách thành ${m.lecs.length} bài giảng, xem ở nhóm “Bài giảng”; cả ${m.lecs.length} đã có trong kho của lớp nên tôi đối chiếu thay vì tạo bản trùng.`}`}];
   if(st.imp===m)render();};
  setTimeout(tick,550);},
 impchat:q=>{const m=st.imp;q=(q||m.q||'').trim();m.q='';if(!q||!m.items)return;m.chat.push({me:1,t:q});render();setTimeout(()=>{m.chat.push(R(aiEdit(m,q,'imp')));if(st.view==='gv-import'&&st.imp===m)render();},650);},
 ocrok:(key,val)=>{const e=document.getElementById('u-'+key),[p,j]=key.split(':');st.imp.fix[key]=(val!=null?val:e?e.value.trim():'')||OCR[p][+j][0];render();},
 ocredit:key=>{delete st.imp.fix[key];render();},
 impsave:()=>{const m=st.imp;if(!m.items)return;busy('Đang lưu vào giáo trình…',700,()=>{const t=saveItems(m.items,m.src,m.fmt)+(m.lecs?saveLecs(m.lecs):'');st.imp=newImp(m.src);toast(t);go('gv-curr');});},
 psel:id=>{st.per={sid:id,prop:st.paths[id]?JSON.parse(JSON.stringify(st.paths[id])):null};render();},
 ppropose:()=>busy('Đang rút lộ trình từ giáo trình chung…',900,()=>{st.per.prop=buildProp(SID(st.per.sid));render();}),
 ptog:i=>{const pr=st.per.prop;if(!pr||pr.approved)return;pr.rows[+i].in=!pr.rows[+i].in;render();},
 papprove:()=>{const pr=st.per.prop;if(!pr||pr.approved)return;busy('Đang áp dụng lộ trình…',600,()=>{pr.approved=true;st.paths[pr.sid]=JSON.parse(JSON.stringify(pr));toast(`Đã duyệt. ${SID(pr.sid).n} thấy lộ trình mới; phụ huynh thấy một dòng tóm tắt.`);render();});}
});
document.addEventListener('click',e=>{
 const dv=e.target.closest('[data-dev]');if(dv){dev=dv.dataset.dev;return render();}
 const r=e.target.closest('[data-role]');if(r){const role=r.dataset.role;dev=null;return go(RAIL[role][0],role);}
 const s=e.target.closest('[data-sc]');if(s){dev=null;const x=SC[+s.dataset.sc];if(x[1]==='hs-work'){st.role='hs';st.cur=st.asg.find(a=>a.p==='p1'&&!a.self).id;const a=A();st.tab=a.open?'sol':'hint';if(a.open)a.seen=true;st.step=0;return go('hs-work');}return go(x[1],x[0]);}
 if(e.target.closest('[data-reset]')){st=init();toast('Đã đặt lại dữ liệu mẫu');return render();}
 const a=e.target.closest('[data-act]');if(a){e.stopPropagation();return ACT[a.dataset.act](a.dataset.arg);}
 const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);});
document.addEventListener('focusout',e=>{const d=e.target&&e.target.dataset&&e.target.dataset.edit;if(d)ACT.dedit(d,e.target.textContent);});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey)return;if(e.target.dataset&&e.target.dataset.edit){e.preventDefault();return e.target.blur();}const id=e.target.id;if(id==='q'){e.preventDefault();ACT.ask();}if(id==='pm'){e.preventDefault();ACT.psend();}if(id==='gq'){e.preventDefault();ACT.gsend();}if(id==='cq'){e.preventDefault();ACT.csend();}if(id==='iq'){e.preventDefault();ACT.impchat();}});
document.addEventListener('input',e=>{if(e.target.id==='cq')st.cmp.q=e.target.value;if(e.target.id==='iq')st.imp.q=e.target.value;if(e.target.id==='rng'){st.pa=+e.target.value;render();const r=document.getElementById('rng');if(r)r.focus();}});
window.addEventListener('resize',render);
render();
</script>
