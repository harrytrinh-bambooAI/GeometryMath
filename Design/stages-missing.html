<style>
/* ---- bổ sung cho bộ màn hình còn thiếu (chép cách làm của stages-2-5 và stages-6-9) ---- */
.screen.ipad{width:1180px;height:820px;grid-template-columns:84px 1fr}
.screen.ipad .rail a{width:70px;font-size:10.5px}
.screen.ipad .top{padding:0 22px}
.screen.ipad .body{padding:4px 22px 22px;gap:16px}
.screen .top h1{white-space:nowrap}
.rail a{text-align:center;line-height:1.2}
.top .r{gap:8px}
.top .r .chip{padding:7px 12px;font-size:12px}
.top .r .ava{margin-left:4px}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
.hint.ok{border-color:#B9E6D2;background:var(--grn-s)}
.hint.bad{border-color:#F5B8B2;background:var(--red-s)}
.hint.warn{border-color:#F4D58A;background:#FFFBEE}
.hint.org{border-color:#F7C2B3;background:var(--org-s)}
.hint.pur{border-color:#D9CCFF;background:var(--pur-s)}
.icb.red{background:var(--red-s);color:var(--red)}
.icb.gry{background:#E7EBF4;color:var(--muted)}
.icb.sm{width:32px;height:32px;border-radius:10px}.icb.sm svg.ic{width:17px;height:17px}
.btn.off{background:#E7EBF4;color:var(--faint)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #F5B8B2}
.btn.line{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.toggle.off{background:#CFD6E4}.toggle.off::after{right:auto;left:3px}
.toggle.lk{opacity:.55}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid #C5CDDD;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}
.cb.on{background:var(--pri);border-color:var(--pri)}.cb svg.ic{width:13px;height:13px;stroke-width:3}
.cb.dis{background:#EEF1F7;border-color:#DDE2EC}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #C3CBDD;flex-shrink:0;background:#fff}
.rd.on{border:6px solid var(--pri)}
.qn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:#EEF1F7;color:var(--muted);flex-shrink:0}
.qn svg.ic{width:18px;height:18px;stroke-width:3}
.qn.g{background:var(--grn);color:#fff}.qn.y{background:var(--yel);color:#fff}.qn.o{background:#fff;color:var(--org);border:2.5px solid var(--org)}
.box{border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff}
.box.soft{background:var(--soft)}
.box.grn{border-color:#B9E6D2;background:var(--grn-s)}
.box.yel{border-color:#F4D58A;background:#FFFBEE}
.box.org{border-color:#F7C2B3;background:var(--org-s)}
.box.pur{border-color:#D9CCFF;background:var(--pur-s)}
.box.pri{border-color:#C9D3F5;background:#F5F7FF}
.box.red{border-color:#F5B8B2;background:var(--red-s)}
.box.sel{border-color:var(--pri);background:#F5F7FF;box-shadow:0 0 0 3px rgba(59,91,219,.10)}
.box.dash{border-style:dashed;background:var(--soft)}
.sep{height:1px;background:var(--line);flex-shrink:0}
.end{margin-left:auto}
.nw{white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
tr.sel td{background:#F5F7FF}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pri)}
tbody tr:last-child td{border-bottom:none}
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:11px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--pri)}
.tl>div.g::before{border-color:var(--grn)}.tl>div.y::before{border-color:var(--yel)}.tl>div.n::before{border-color:#C3CBDD}.tl>div.r::before{border-color:var(--red)}
.stamp{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;border:2px solid var(--red);color:var(--red);font-weight:800;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.stamp svg.ic{width:14px;height:14px;stroke-width:2.4}
.field.sm{padding:7px 10px;font-size:12.5px;border-radius:10px}
.seg span{white-space:nowrap}.card h2{white-space:nowrap}
.step{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:var(--pri);background:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/ds.js"></script>
<script>
/* icon bổ sung (chỉ trong bộ nhớ, không sửa ds.js) */
Object.assign(P,{graph:"M4 20V4M4 20h16M6 9c2.500 9 6 9 8 1s3-4 4-4",
 drag:"M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01",

 link:"M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1",
 down:"M12 4v12M6 11l6 6 6-6M5 20h14",
 sliders:"M4 7h10M18 7h2M4 17h2M10 17h10M16 7m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0",
 chev:"M9 6l6 6-6 6",info:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 11v5M12 7.500v.5",
 key:"M8 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8M12 11h9M18 11v3M15 11v2",
 eyeoff:"M3 3l18 18M10.500 6.200A9.500 9.500 0 0 1 12 6c6 0 10 6 10 6a17 17 0 0 1-3 3.600M6.500 7.500C3.800 9.300 2 12 2 12s4 6 10 6c1.400 0 2.700-.3 3.900-.8",
 minus:"M5 12h14",trash:"M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"});

/* ---------- khung ---------- */
const NAVM={
 hs2:[['home','Bài của em'],['flame','Luyện tập'],['cube','Tự học'],['clock','Lịch sử']],
 gv:[['home','Tổng quan'],['book','Kho đề'],['users','Lớp học'],['chart','Theo dõi']],
 gv5:[['home','Tổng quan'],['book','Kho đề'],['users','Lớp học'],['chart','Theo dõi'],['edit','Chấm bài'],['spark','Trợ lý']],
 gv7:[['home','Tổng quan'],['book','Kho đề'],['users','Lớp học'],['chart','Theo dõi'],['shield','Nhóm học'],['layers','Cộng đồng']],
 sp:[['layers','Môn học'],['shield','Hợp chuẩn']],
 tr6:[['home','Tổng quan'],['users','Lớp & GV'],['link','Phụ huynh'],['bell','Thông báo']],
 tr8:[['home','Tổng quan'],['users','Lớp & GV'],['bell','Thông báo'],['sliders','Chính sách'],['chart','Báo cáo'],['eye','Sổ truy cập']],
 tr9:[['home','Tổng quan'],['users','Lớp & GV'],['bell','Thông báo'],['file','Văn bản'],['sliders','Chính sách'],['chart','Báo cáo']]};
const WHOM={hs:['A','#F0522B'],gv:['GV','#3B5BDB'],tr:['QT','#7C4DFF'],sp:['SP','#141B2D']};
const stageChip=n=>`<span class="chip pur">${ic('spark')}Concept · Chặng ${n}</span>`;
function frame(id,o,body){
 const ip=o.dev==='ipad';
 return `<section class="screen${ip?' ipad':''}" id="${id}">
 <nav class="rail"><div class="logo">${ic('cube')}</div>${NAVM[o.nav].map((n,i)=>`<a class="${i===o.on?'on':''}">${ic(n[0],'width:22px;height:22px')}${n[1]}</a>`).join('')}<div class="sp"></div></nav>
 <div class="main"><div class="top"><div style="min-width:0"><h1>${o.title}</h1>${o.crumb?`<div class="crumb">${o.crumb}</div>`:''}</div>
 <div class="r"><span class="chip">${ic(o.role==='hs'?'users':'school')}${o.label} · ${ip?'iPad ngang 1180×820':'Web 1440×900'}</span>${stageChip(o.stage)}<div class="ava" style="background:${WHOM[o.role][1]}">${WHOM[o.role][0]}</div></div></div>
 <div class="body">${body}</div></div></section>`;}
const hint=(cls,icl,icon,h,p,extra='')=>`<div class="hint ${cls}"><div class="icb ${icl}">${ic(icon)}</div><div class="grow"><h3>${h}</h3>${p?`<p>${p}</p>`:''}${extra}</div></div>`;
const ok=t=>`<span class="chip grn">${ic('shield')}${t||'Đã kiểm chứng'}</span>`;
const rev=t=>`<span class="chip yel">${ic('warn')}${t||'Cần xem lại'}</span>`;
const aiS=t=>`<span class="chip pur">${ic('spark')}${t||'AI soạn'}</span>`;
const gvD=t=>`<span class="chip pri">${ic('check')}${t||'Giáo viên đã duyệt'}</span>`;
const COL={An:'#F0522B','Bình':'#3B5BDB',Chi:'#E8A200','Dũng':'#B45309','Hà':'#D6336C'};
const ava=(n,s=30,c)=>`<div class="ava" style="width:${s}px;height:${s}px;font-size:${s<34?12:14}px;background:${c||COL[n]||'#64748B'}">${n[0]}</div>`;
const TF='font-family="Be Vietnam Pro" font-weight="800"';
const note=(icon,t,st='')=>`<div class="row small muted" style="align-items:flex-start;gap:8px;${st}">${ic(icon,'width:16px;height:16px;margin-top:2px')}<span>${t}</span></div>`;

/* ---------- hình và đồ thị (tính từ số liệu) ---------- */
// Tam giác vuông tại A: AB = 6, AC = 8, BC = 10, BH = 3,6, AH = 4,8. Tỉ lệ 16px/cm: B(20,104) C(180,104) A(77.6,27.2) H(77.6,104)
const triMini=()=>`<svg viewBox="0 0 200 124" xmlns="http://www.w3.org/2000/svg">
<polygon points="20,104 180,104 77.6,27.2" fill="#3B5BDB" fill-opacity=".09" stroke="#253150" stroke-width="2" stroke-linejoin="round"/>
<line x1="77.6" y1="27.2" x2="77.6" y2="104" stroke="#F0522B" stroke-width="2.6" stroke-linecap="round"/><path d="M77.6,96H85.6V104" fill="none" stroke="#F0522B" stroke-width="1.4"/>
<g fill="#141B2D" font-size="12" ${TF}><text x="72" y="20">A</text><text x="6" y="110">B</text><text x="185" y="110">C</text></g><text x="73" y="119" fill="#F0522B" font-size="12" ${TF}>H</text>
<g fill="#5F6B85" font-size="10.5" font-family="Be Vietnam Pro" font-weight="700"><text x="16" y="60">6 cm</text><text x="136" y="58">8 cm</text></g></svg>`;
const triThumb=c=>`<svg viewBox="0 0 100 90"><polygon points="12,76 90,76 40,12" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><path d="M40,12V76" stroke="${c}" stroke-width="1.8" stroke-dasharray="4 4"/><path d="M40,68H48V76" fill="none" stroke="${c}" stroke-width="1.600"/></svg>`;
function graph(o){const {w,h,x0,x1,y0,y1,f,c='#3B5BDB',sw=3.2,full=1,extra=()=>''}=o;
 const X=x=>+((x-x0)/(x1-x0)*w).toFixed(1), Y=y=>+(h-(y-y0)/(y1-y0)*h).toFixed(1);
 const path=(a,b)=>{let d='',pen=0;for(let i=0;i<=600;i++){const x=a+(b-a)*i/600,y=f(x);if(y<y0-.05||y>y1+.05){pen=0;continue}d+=(pen?'L':'M')+X(x)+','+Y(y);pen=1}return d};
 let g='',t='';
 if(full){for(let x=Math.ceil(x0);x<=x1;x++){g+=`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${h}"/>`;if(x!==0&&x>x0&&x<x1)t+=`<text x="${X(x)}" y="${Y(0)+19}" text-anchor="middle">${x<0?'−'+(-x):x}</text>`}
  for(let y=Math.ceil(y0);y<=y1;y++){g+=`<line x1="0" y1="${Y(y)}" x2="${w}" y2="${Y(y)}"/>`;if(y!==0&&y>y0&&y<y1)t+=`<text x="${X(0)-9}" y="${Y(y)+5}" text-anchor="end">${y<0?'−'+(-y):y}</text>`}
  t+=`<text x="${X(0)-9}" y="${Y(0)+19}" text-anchor="end">O</text><text x="${w-10}" y="${Y(0)-9}" font-style="italic">x</text><text x="${X(0)+9}" y="14" font-style="italic">y</text>`}
 const ax=full?'#253150':c;
 return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${full?`<rect width="${w}" height="${h}" fill="#fff"/><g stroke="#E3E8F2" stroke-width="1">${g}</g>`:''}
 <g stroke="${ax}" stroke-width="${full?1.8:1.4}" opacity="${full?1:.55}" fill="none" stroke-linecap="round"><path d="M0,${Y(0)}H${w}M${X(0)},${h}V0"/>${full?`<path d="M${w-9},${Y(0)-5}L${w},${Y(0)}L${w-9},${Y(0)+5}M${X(0)-5},9L${X(0)},0L${X(0)+5},9"/>`:''}</g>
 <g fill="#5F6B85" font-size="13" font-family="Be Vietnam Pro" font-weight="600" stroke="#fff" stroke-width="4" paint-order="stroke">${t}</g>
 <path d="${path(x0,x1)}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>${extra(X,Y,path)}</svg>`;}
const gThumb=(f,c,r=[-3,3,-3,3])=>graph({w:100,h:90,x0:r[0],x1:r[1],y0:r[2],y1:r[3],f,c,sw:2.6,full:0});
// y = x³ − 3x² + 2 trên [−1; 3]: y(−1) = −2, y(0) = 2, y(2) = −2, y(3) = 2
const cubic=x=>x*x*x-3*x*x+2;
const cubicG=graph({w:420,h:490,x0:-2,x1:4,y0:-3.5,y1:3.5,f:cubic,c:'#B9C6F2',sw:2.4,extra:(X,Y,path)=>`
 <rect x="${X(-1)}" y="0" width="${X(3)-X(-1)}" height="490" fill="#3B5BDB" fill-opacity=".05"/>
 <path d="${path(-1,3)}" fill="none" stroke="#3B5BDB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
 ${[[-1,-2,'#0F8A5F'],[0,2,'#F0522B'],[2,-2,'#0F8A5F'],[3,2,'#F0522B']].map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="6.5" fill="${p[2]}" stroke="#fff" stroke-width="2"/>`).join('')}
 <g font-size="14" ${TF} stroke="#fff" stroke-width="4" paint-order="stroke"><text x="${X(0)+12}" y="${Y(2)-10}" fill="#F0522B">(0; 2)</text><text x="${X(3)-8}" y="${Y(2)-12}" fill="#F0522B" text-anchor="end">(3; 2)</text>
 <text x="${X(-1)+10}" y="${Y(-2)+36}" fill="#0F8A5F">(−1; −2)</text><text x="${X(2)}" y="${Y(-2)+24}" fill="#0F8A5F" text-anchor="middle">(2; −2)</text></g>`});

/* =================== C2-07 · Kết quả bài luyện =================== */
// Tự kiểm: câu 3 BH = AB²/BC = 36/10 = 3,6 = 18/5; câu 4 AH = 6·8/10 = 4,8; câu 6 BC = 13, sin B = AC/BC = 12/13.
const QS=[
 [1,'Tam giác ABC vuông tại A, AB = 3 cm, AC = 4 cm. Tính BC.','BC = 5 cm','g','Đúng ngay lượt 1'],
 [2,'Tam giác ABC vuông tại A, AB = 6 cm, AC = 8 cm. Tính BC.','BC = 10 cm','g','Đúng ngay lượt 1'],
 [3,'Tam giác ABC vuông tại A, AB = 6 cm, BC = 10 cm, đường cao AH. Tính BH.','BH = 18/5 cm','g','Đúng ngay lượt 1','Máy vẫn tính đúng. Dạng chuẩn: 3,6 cm'],
 [4,'Tam giác ABC vuông tại A, AB = 6 cm, AC = 8 cm, đường cao AH. Tính AH.','AH = 4,8 cm','y','Đúng ở lượt 2 · sau gợi ý 1'],
 [5,'Tam giác ABC vuông tại A, đường cao AH, BH = 4 cm, HC = 9 cm. Tính AH.','','o','Đã dùng hết 3 lượt thử'],
 [6,'Tam giác ABC vuông tại A, AB = 5 cm, AC = 12 cm. Tính sin B.','sin B = 12/13','g','Đúng ngay lượt 1'],
 [7,'Tam giác ABC vuông tại A, AB = 5 cm, góc B = 60°. Tính AC.','','n',''],
 [8,'Tam giác ABC vuông tại A, AB = 3 cm, AC = 4 cm. Tính góc B (làm tròn đến độ).','','n','']];
const qRow=q=>{const [n,t,a,s,st,ex]=q;
 const right=s==='g'||s==='y'?`<div style="text-align:right;flex-shrink:0"><div class="mono" style="font-size:13.5px">${a}</div><div class="tiny" style="color:${s==='g'?'var(--grn)':'#9A6B00'};font-weight:700">${st}</div></div>`
  :s==='o'?`<div style="text-align:right;flex-shrink:0"><span class="chip org">${ic('users')}Xem lại cùng thầy cô</span><div class="tiny muted" style="margin-top:3px">${st}</div></div>`
  :`<span class="btn sm soft" style="flex-shrink:0">Làm câu này</span>`;
 return `<div class="row" style="padding:8px 12px;border:1.5px solid ${s==='o'?'#F7C2B3':'var(--line)'};border-radius:13px;gap:12px;background:${s==='o'?'#FFF8F5':s==='n'?'var(--soft)':'#fff'}">
 <div class="qn ${s==='n'?'':s}">${s==='g'||s==='y'?ic('check'):n}</div>
 <div class="grow"><div style="font-weight:600;font-size:13.5px;line-height:1.35"><span class="muted">Câu ${n}.</span> ${t}</div>${ex?`<div class="tiny" style="margin-top:2px;color:var(--pri);font-weight:700">${ex}</div>`:''}${s==='o'?`<div class="tiny muted" style="margin-top:2px">${ic('lock','width:12px;height:12px;vertical-align:-2px')} Đáp số và lời giải của câu này mở lúc 20:00 hôm nay</div>`:''}${s==='n'?`<div class="tiny muted" style="margin-top:2px">Chưa làm</div>`:''}</div>${right}</div>`;};
const C207=frame('st-c2-07-ket-qua-bai-luyen',{nav:'hs2',on:1,role:'hs',label:'Học sinh',dev:'ipad',stage:2,title:'Kết quả bài luyện',crumb:'Hệ thức lượng trong tam giác vuông · lớp 11A1 · 8 câu'},`
<div class="card pad col grow" style="gap:8px;min-width:0">
 <div class="row"><h2 style="margin:0" class="grow">Từng câu của em</h2>
  <span class="row tiny muted" style="gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:var(--grn)"></span>Đúng</span>
  <span class="row tiny muted" style="gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:var(--yel)"></span>Đúng sau gợi ý</span>
  <span class="row tiny muted" style="gap:5px"><span style="width:10px;height:10px;border-radius:3px;border:2px solid var(--org)"></span>Xem lại cùng thầy cô</span></div>
 ${QS.map(qRow).join('')}
</div>
<div class="card side" style="width:348px"><div class="pad col grow" style="gap:12px">
 <div style="padding:16px;border-radius:14px;background:linear-gradient(135deg,#3B5BDB,#7C4DFF);color:#fff">
  <div class="tiny" style="opacity:.9;font-weight:700">Em đã làm</div>
  <div style="font-size:30px;font-weight:800;line-height:1.15">6/8 câu</div>
  <div style="display:flex;gap:4px;margin-top:10px">${['g','g','g','y','o','g','n','n'].map(s=>`<i style="flex:1;height:9px;border-radius:99px;background:${s==='g'?'#5BE3B0':s==='y'?'#FFD466':s==='o'?'#FF9C80':'rgba(255,255,255,.28)'}"></i>`).join('')}</div>
  <div class="tiny" style="opacity:.9;margin-top:8px">Bài chưa làm xong · em làm tiếp lúc nào cũng được</div></div>
 <div class="row" style="gap:8px">
  <div class="box grn grow" style="padding:10px 8px;text-align:center"><b style="font-size:22px;color:var(--grn)">5</b><div class="tiny" style="font-weight:700">đúng</div></div>
