<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thiết kế chặng 2–5 – Hình Học Không Gian Cùng AI</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ds.css">
<style>
/* ---- bổ sung cho chặng 2–5 ---- */
.screen.ipad{width:1180px;height:820px;grid-template-columns:84px 1fr}
.screen.ipad .rail a{width:70px;font-size:10.5px}
.screen.ipad .top{padding:0 22px}
.screen.ipad .body{padding:4px 22px 22px;gap:16px}
.screen.bare{display:flex;flex-direction:column}
.screen .top h1{white-space:nowrap}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
.hint.ok{border-color:#B9E6D2;background:var(--grn-s)}
.hint.bad{border-color:#F5B8B2;background:var(--red-s)}
.hint.warn{border-color:#F4D58A;background:#FFFBEE}
.hint.org{border-color:#F7C2B3;background:var(--org-s)}
.hint.pur{border-color:#D9CCFF;background:var(--pur-s)}
.icb.red{background:var(--red-s);color:var(--red)}
.icb.sm{width:32px;height:32px;border-radius:10px}.icb.sm svg.ic{width:17px;height:17px}
.btn.off{background:#E7EBF4;color:var(--faint)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #F5B8B2}
.toggle.off{background:#CFD6E4}.toggle.off::after{right:auto;left:3px}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid #C5CDDD;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.cb.on{background:var(--pri);border-color:var(--pri)}.cb svg.ic{width:13px;height:13px;stroke-width:3}
.qn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:#EEF1F7;color:var(--muted)}
.qn.g{background:var(--grn);color:#fff}.qn.cur{background:#fff;color:var(--org);border:2.5px solid var(--org)}
.qstrip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 28px rgba(20,27,45,.14);white-space:nowrap}
.code{display:flex;gap:8px}.code b{width:52px;height:62px;border-radius:13px;border:2px solid var(--pri);background:#F5F7FF;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--pri)}
.hm{display:grid;grid-template-columns:120px repeat(6,1fr) 84px;gap:6px;align-items:center}
.hm .h{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.3}
.hc{height:54px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:12px}
.hc svg.ic{width:16px;height:16px;stroke-width:2.6}
.hc.c1{background:#0F8A5F;color:#fff}.hc.c2{background:#FFE7A3;color:#7A5500}.hc.c0{background:#F9C9C3;color:#A1160C}.hc.cn{background:#fff;border:1.5px dashed #C5CDDD;color:var(--faint)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}.lg .hc{width:26px;height:22px;border-radius:7px}.lg .hc svg.ic{width:12px;height:12px}
.subj{overflow:hidden;display:flex;flex-direction:column}
.subj .art{height:156px;display:flex;align-items:center;justify-content:center;gap:10px}
.subj .art svg{height:108px}
.slider{height:8px;border-radius:99px;background:#E7EBF4;position:relative;margin:10px 0 6px}
.slider i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--org)}
.slider b{position:absolute;top:-8px;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--org);box-shadow:0 2px 6px rgba(0,0,0,.18);transform:translateX(-50%)}
.float{position:absolute;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:12px}
.pin{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font:800 12px 'Be Vietnam Pro';color:#fff;vertical-align:middle;margin-left:8px}
.wrong{border:2px solid var(--org);border-radius:8px;background:rgba(240,82,43,.08);padding:1px 8px;margin:2px -10px;display:block}
.pg{width:96px;height:122px;border-radius:12px;border:1.5px solid var(--line);background:#FFFDF6;position:relative;flex-shrink:0;overflow:hidden;padding:10px 9px}
.pg u{display:block;height:3px;border-radius:2px;background:#9AA7CC;margin-bottom:8px;text-decoration:none}
.pg.blur u{filter:blur(2.2px)}
.pg .bd{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}.pg .bd svg.ic{width:13px;height:13px;stroke-width:3}
.tabbar{display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 10px 18px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted)}.tabbar a.on{color:var(--pri)}
.lvl{border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;font-size:12px;flex:1;min-width:0;background:#fff}
.lvl b{display:block;font-size:13px;color:var(--pri)}
.big{font-size:19px;line-height:1.5}
.screen.ipad .dock b{width:auto;min-width:64px;padding:7px 9px 5px;white-space:nowrap}
td.nw{white-space:nowrap}
</style>
</head>

<script>
/* icon bổ sung (chỉ trong bộ nhớ, không sửa ds.js) */
Object.assign(P,{alt:"M3 19h18L9 5zM9 5v14",med:"M3 19h18L9 5zM9 5l3 14",graph:"M4 20V4M4 20h16M6 9c2.500 9 6 9 8 1s3-4 4-4",
 drag:"M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01",slider:"M4 8h16M4 16h16M9 8m-2.2 0a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0M15 16m-2.2 0a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0",
 copy:"M9 9h11v11H9zM5 15V4h11",warn:"M12 4l9 16H3zM12 10v5M12 17.500v.5",upload:"M12 16V5M7 10l5-5 5 5M5 20h14",expand:"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5",
 qr:"M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3h-3zM20 17v3h-3",eyeoff:"M3 3l18 18M10.500 6.200A9.500 9.500 0 0 1 12 6c6 0 10 6 10 6a17 17 0 0 1-3 3.600M6.500 7.500C3.800 9.300 2 12 2 12s4 6 10 6c1.400 0 2.700-.3 3.900-.8",
 table:"M4 5h16v14H4zM4 10h16M4 15h16M10 5v14",cross:"M5 12h14M12 5v14M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0",phone:"M7 3h10v18H7zM11 18h2"});

/* ---------- khung ---------- */
const NAVX={
 gv:[['home','Tổng quan'],['book','Kho đề'],['users','Lớp học'],['chart','Theo dõi']],
 gv5:[['home','Tổng quan'],['book','Kho đề'],['users','Lớp học'],['chart','Theo dõi'],['edit','Chấm bài'],['spark','Trợ lý']],
 hs2:[['home','Bài của em'],['flame','Luyện tập'],['cube','Tự học'],['clock','Lịch sử']],
 hs4:[['home','Bài của em'],['layers','Môn học'],['flame','Luyện tập'],['cube','Tự học'],['clock','Lịch sử']]};
const stageChip=n=>`<span class="chip pur" style="padding:7px 12px">${ic('spark')}Concept · Chặng ${n}</span>`;
function frame(id,o,body){
 const ip=o.dev==='ipad', gv=o.role==='gv';
 const dev=gv?'Giáo viên · Web 1440×900':'Học sinh · iPad ngang 1180×820';
 const who=o.who||(gv?['GV','#3B5BDB']:['A','#F0522B']);
 return `<section class="screen${ip?' ipad':''}" id="${id}">
 <nav class="rail"><div class="logo">${ic('cube')}</div>${NAVX[o.nav].map((n,i)=>`<a class="${i===o.on?'on':''}">${ic(n[0],'width:22px;height:22px')}${n[1]}</a>`).join('')}<div class="sp"></div></nav>
 <div class="main"><div class="top"><div style="min-width:0"><h1>${o.title}</h1>${o.crumb?`<div class="crumb">${o.crumb}</div>`:''}</div>
 <div class="r"><span class="chip" style="padding:7px 12px">${ic(gv?'school':'users')}${dev}</span>${stageChip(o.stage)}<div class="ava" style="background:${who[1]}">${who[0]}</div></div></div>
 <div class="body">${body}</div></div></section>`;}
const mob=(id,stage,who,inner)=>`<section class="screen mobile" id="${id}"><div style="height:100%;display:flex;flex-direction:column">
 <div class="row" style="padding:10px 14px 0;gap:6px"><span class="chip">${ic('phone')}${who} · iPhone 390×844</span><span class="chip pur" style="margin-left:auto">${ic('spark')}Concept · Chặng ${stage}</span></div>${inner}</div></section>`;
const hint=(cls,icl,icon,h,p,extra='')=>`<div class="hint ${cls}"><div class="icb ${icl}">${ic(icon)}</div><div class="grow"><h3>${h}</h3>${p?`<p>${p}</p>`:''}${extra}</div></div>`;
const ok=t=>`<span class="chip grn">${ic('shield')}${t||'Đã kiểm chứng'}</span>`;
const rev=t=>`<span class="chip yel">${ic('warn')}${t||'Cần xem lại'}</span>`;
const ava=(n,c,s=30)=>`<div class="ava" style="width:${s}px;height:${s}px;font-size:${s<34?12:14}px;background:${c}">${n[0]}</div>`;
const COL={An:'#F0522B','Bình':'#3B5BDB',Chi:'#0F8A5F','Dũng':'#7C4DFF','Hà':'#0EA5E9'};
const TF='font-family="Be Vietnam Pro" font-weight="800"';

/* ---------- hình phẳng (đúng tỉ lệ) ---------- */
// Tam giác vuông tại A: AB=6, AC=8, BC=10, AH=4,8, BH=3,6. Tỉ lệ 40px/cm.
const tri685=()=>`<svg viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg">
<polygon points="60,260 460,260 204,68" fill="#3B5BDB" fill-opacity=".09" stroke="#253150" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M195.600,79.200L206.800,87.600L215.200,76.400" fill="none" stroke="#253150" stroke-width="1.8"/>
<line x1="204" y1="68" x2="204" y2="260" stroke="#F0522B" stroke-width="3.4" stroke-linecap="round"/>
<path d="M204,246H218V260" fill="none" stroke="#F0522B" stroke-width="1.8"/>
<g fill="#141B2D"><circle cx="60" cy="260" r="5"/><circle cx="460" cy="260" r="5"/><circle cx="204" cy="68" r="5"/></g><circle cx="204" cy="260" r="5" fill="#F0522B"/>
<g fill="#141B2D" font-size="20" ${TF}><text x="197" y="54">A</text><text x="34" y="270">B</text><text x="472" y="270">C</text></g><text x="197" y="288" fill="#F0522B" font-size="20" ${TF}>H</text>
<g fill="#5F6B85" font-size="16" font-family="Be Vietnam Pro" font-weight="700"><text x="82" y="158">6 cm</text><text x="342" y="150">8 cm</text></g>
<text x="214" y="176" fill="#F0522B" font-size="17" ${TF}>AH = ?</text></svg>`;
// Tam giác AB=13, AC=15, BC=14: B(0,0) C(14,0) A(5,12); H(5,0), M(7,0). Tỉ lệ 26px/cm.
const tri345=(o={})=>`<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg">
<polygon points="80,360 444,360 210,48" fill="#3B5BDB" fill-opacity=".09" stroke="#253150" stroke-width="2.6" stroke-linejoin="round"/>
${o.med?`<line x1="210" y1="48" x2="262" y2="360" stroke="#7C4DFF" stroke-width="2.6" stroke-dasharray="8 6"/><circle cx="262" cy="360" r="5.500" fill="#7C4DFF"/><text x="256" y="390" fill="#7C4DFF" font-size="20" ${TF}>M</text>`:''}
${o.alt?`<line x1="210" y1="48" x2="210" y2="360" stroke="#F0522B" stroke-width="3.4" stroke-linecap="round"/><path d="M210,345H225V360" fill="none" stroke="#F0522B" stroke-width="1.8"/><circle cx="210" cy="360" r="5.500" fill="#F0522B"/><text x="203" y="390" fill="#F0522B" font-size="20" ${TF}>H</text>${o.q?`<text x="150" y="250" fill="#F0522B" font-size="17" ${TF}>AH = ?</text>`:''}`:''}
<g fill="#141B2D"><circle cx="80" cy="360" r="5"/><circle cx="444" cy="360" r="5"/><circle cx="210" cy="48" r="5"/></g>
<g fill="#141B2D" font-size="20" ${TF}><text x="203" y="34">A</text><text x="54" y="372">B</text><text x="456" y="372">C</text></g>
<g fill="#5F6B85" font-size="16" font-family="Be Vietnam Pro" font-weight="700"><text x="112" y="196">13</text><text x="340" y="196">15</text><text x="345" y="388">14</text></g></svg>`;
// Đường tròn bán kính 5, dây AB cách tâm 3 → nửa dây 4. Tỉ lệ 21px/cm.
const circ=()=>`<svg viewBox="0 0 300 244" xmlns="http://www.w3.org/2000/svg">
<circle cx="150" cy="116" r="105" fill="#3B5BDB" fill-opacity=".08" stroke="#253150" stroke-width="2.4"/>
<line x1="66" y1="179" x2="234" y2="179" stroke="#F0522B" stroke-width="3.6" stroke-linecap="round"/>
<line x1="150" y1="116" x2="150" y2="179" stroke="#253150" stroke-width="2" stroke-dasharray="6 5"/><line x1="150" y1="116" x2="66" y2="179" stroke="#253150" stroke-width="2"/>
<path d="M150,168H161V179" fill="none" stroke="#253150" stroke-width="1.600"/>
<g fill="#141B2D"><circle cx="150" cy="116" r="4.500"/><circle cx="66" cy="179" r="4.500"/><circle cx="234" cy="179" r="4.500"/><circle cx="150" cy="179" r="4"/></g>
<g fill="#141B2D" font-size="17" ${TF}><text x="144" y="106">O</text><text x="44" y="198">A</text><text x="242" y="198">B</text><text x="144" y="200">H</text></g>
<g fill="#5F6B85" font-size="14" font-family="Be Vietnam Pro" font-weight="700"><text x="156" y="152">3</text><text x="94" y="140">5</text></g></svg>`;
const triThumb=c=>`<svg viewBox="0 0 100 90"><polygon points="12,76 90,76 40,12" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><path d="M40,12V76" stroke="${c}" stroke-width="1.8" stroke-dasharray="4 4"/><path d="M40,68H48V76" fill="none" stroke="${c}" stroke-width="1.600"/></svg>`;
const circThumb=c=>`<svg viewBox="0 0 100 90"><circle cx="50" cy="45" r="34" fill="${c}" fill-opacity=".13" stroke="${c}" stroke-width="2.4"/><path d="M23,66H77" stroke="${c}" stroke-width="2.4"/><path d="M50,45V66" stroke="${c}" stroke-width="1.600" stroke-dasharray="4 4"/><circle cx="50" cy="45" r="2.500" fill="${c}"/></svg>`;

/* ---------- đồ thị (tính từ hàm số) ---------- */
function graph(o){const {w,h,x0,x1,y0,y1,f,c='#3B5BDB',sw=3.2,full=1,extra=()=>''}=o;
 const X=x=>+((x-x0)/(x1-x0)*w).toFixed(1), Y=y=>+(h-(y-y0)/(y1-y0)*h).toFixed(1);
 let d='',pen=0;for(let i=0;i<=600;i++){const x=x0+(x1-x0)*i/600,y=f(x);if(y<y0-.05||y>y1+.05){pen=0;continue}d+=(pen?'L':'M')+X(x)+','+Y(y);pen=1}
 let g='',t='';
 if(full){for(let x=Math.ceil(x0);x<=x1;x++){g+=`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${h}"/>`;if(x!==0&&x>x0&&x<x1)t+=`<text x="${X(x)}" y="${Y(0)+19}" text-anchor="middle">${x<0?'−'+(-x):x}</text>`}
  for(let y=Math.ceil(y0);y<=y1;y++){g+=`<line x1="0" y1="${Y(y)}" x2="${w}" y2="${Y(y)}"/>`;if(y!==0&&y>y0&&y<y1)t+=`<text x="${X(0)-9}" y="${Y(y)+5}" text-anchor="end">${y<0?'−'+(-y):y}</text>`}
  t+=`<text x="${X(0)-9}" y="${Y(0)+19}" text-anchor="end">O</text><text x="${w-10}" y="${Y(0)-9}" font-style="italic">x</text><text x="${X(0)+9}" y="14" font-style="italic">y</text>`}
 const ax=full?'#253150':c;
 return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${full?`<rect width="${w}" height="${h}" fill="#fff"/><g stroke="#E3E8F2" stroke-width="1">${g}</g>`:''}
 <g stroke="${ax}" stroke-width="${full?1.8:1.4}" opacity="${full?1:.55}" fill="none" stroke-linecap="round"><path d="M0,${Y(0)}H${w}M${X(0)},${h}V0"/>${full?`<path d="M${w-9},${Y(0)-5}L${w},${Y(0)}L${w-9},${Y(0)+5}M${X(0)-5},9L${X(0)},0L${X(0)+5},9"/>`:''}</g>
 <g fill="#5F6B85" font-size="13" font-family="Be Vietnam Pro" font-weight="600" stroke="#fff" stroke-width="4" paint-order="stroke">${t}</g>
 <path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>${extra(X,Y)}</svg>`;}
const gThumb=(f,c,r=[-3,3,-3,3])=>graph({w:100,h:90,x0:r[0],x1:r[1],y0:r[2],y1:r[3],f,c,sw:2.6,full:0});
// (P): y = x² − 2mx + m + 2 với m = 1 → y = x² − 2x + 3, đỉnh I(1; 2), cắt Oy tại (0; 3)
const para=graph({w:480,h:540,x0:-3,x1:5,y0:-1.5,y1:7.5,f:x=>x*x-2*x+3,c:'#3B5BDB',extra:(X,Y)=>`
 <line x1="${X(1)}" y1="${Y(2)}" x2="${X(1)}" y2="${Y(0)}" stroke="#F0522B" stroke-width="1.8" stroke-dasharray="6 5"/>
 <line x1="${X(1)}" y1="${Y(2)}" x2="${X(0)}" y2="${Y(2)}" stroke="#F0522B" stroke-width="1.8" stroke-dasharray="6 5"/>
 <circle cx="${X(1)}" cy="${Y(2)}" r="7" fill="#F0522B" stroke="#fff" stroke-width="2"/><text x="${X(1)+12}" y="${Y(2)+22}" fill="#F0522B" font-size="16" ${TF}>I(1; 2)</text>
 <circle cx="${X(0)}" cy="${Y(3)}" r="6" fill="#7C4DFF" stroke="#fff" stroke-width="2"/><text x="${X(0)+12}" y="${Y(3)-8}" fill="#7C4DFF" font-size="15" ${TF}>(0; 3)</text>
 <text x="${X(3.38)}" y="${Y(6.6)}" fill="#3B5BDB" font-size="16" ${TF}>(P)</text>`});

const dock2=(items,on)=>`<div class="dock">${items.map((x,i)=>x==='|'?'<i></i>':`<b class="${i===on?'on':''}">${ic(x[0],'width:21px;height:21px')}${x[1]}</b>`).join('')}</div>`;

/* =================== CHẶNG 2 =================== */
const C21=frame('c2-01-luyen-tap-cham-tu-dong',{nav:'hs2',on:1,role:'hs',dev:'ipad',stage:2,title:'Luyện tập: Hệ thức lượng trong tam giác vuông',crumb:'Lớp 11A1 · Ôn hình phẳng · máy chấm ngay từng câu'},`
<div class="canvas">
 <div class="prob"><div class="icb pri">${ic('file')}</div><div class="grow"><b>Câu 4.</b> Tam giác ABC vuông tại A, AB = 6 cm, AC = 8 cm. Kẻ đường cao AH (H thuộc BC). Tính độ dài AH.</div>${ok('Hình đã kiểm chứng')}</div>
 <div class="fig" style="top:100px;bottom:90px">${tri685()}</div>
 <div class="qstrip"><span class="small muted" style="font-weight:700;margin-right:4px">Câu</span>${[1,2,3,4,5,6,7,8].map(i=>`<div class="qn ${i<4?'g':i===4?'cur':''}">${i<4?ic('check','width:18px;height:18px;stroke-width:3'):i}</div>`).join('')}</div>
</div>
<div class="card side" style="width:368px"><div class="pad col grow" style="gap:11px">
 <div class="row" style="padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#F0522B,#E8A200);color:#fff"><div class="icb" style="background:rgba(255,255,255,.22);color:#fff">${ic('flame')}</div><div class="grow"><div style="font-size:17px;font-weight:800">Chuỗi 3 câu đúng</div><div class="tiny" style="opacity:.9">Trả lời đúng câu này để nối chuỗi</div></div><b style="font-size:15px">4/8</b></div>
 <div><div class="lbl">Đáp số của em</div>
