# Đề xuất của ARCH cho app/server/quality/sql-lint.properties (CODE đã hợp nhất bản trước, M-504). ĐỀ XUẤT, chưa được TechLead duyệt.
# Lượt sửa sau phản biện RV: thêm bảng mới (D-GEO-133, 150, 152, 156, 159, 162), thêm danh sách bảng chỉ ghi qua hàm (D-GEO-158).
# Quy ước: tên bảng chữ thường, không kèm tiền tố schema (schema geo).
#
# large.tables : mọi SELECT phải có LIMIT (hoặc chú thích sqllint:allow=unbounded kèm lý do).
large.tables=event_log,ai_call_log,answer_guard_log,qa_turn,assignment_progress,assignment,class_member,app_user,problem,problem_version,problem_signature,lecture,keyword,audit_log,durable_request,auth_failure,probe_run
# tenant.tables: mọi câu lệnh phải lọc org_id = :orgId (INSERT có cột org_id). Câu đọc nội dung nền tảng (org_id = :platformOrgId) KHÔNG tính là
# bộ lọc trường: phải mang sqllint:allow=tenant kèm lý do (D-GEO-171).
tenant.tables=app_user,teacher_access_code,class,class_member,problem,problem_version,problem_signature,scene_build,hint,solution,verification_report,assignment,assignment_progress,event_log,durable_request,ai_call_log,answer_guard_log,qa_turn,lecture,keyword,audit_log,share_grant
# Ngoại lệ có chủ đích của org_id (sqllint:allow=tenant kèm lý do): tra lớp theo mã lớp toàn cục (đăng nhập, nằm trong fn_student_login),
# điểm kiểm share_grant theo grantee_org_id. Xem 02_multi_tenant.md §2. Bảng không thuộc trường: org, subject, problem_topic, solid_template,
# probe_prompt, probe_run, auth_failure (chỉ trong fn_teacher_login).
