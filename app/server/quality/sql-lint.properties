# Cấu hình bộ quét SQL (vn.geo.server.quality.SqlLint). Danh sách phân tách bằng dấu phẩy, tên bảng chữ thường,
# KHÔNG kèm tiền tố schema (SqlLint bỏ tiền tố khi so: geo.problem = problem).
#
# Hợp nhất với đề xuất của ARCH: artifacts/GEO/work/architecture/sql-lint.proposal.properties (D-GEO-168, RV-GEO-20).
# Mọi khóa dưới đây SqlLint đều hỗ trợ; khóa lạ làm SqlScanTest đỏ (không bao giờ bị bỏ qua âm thầm).
#
# large.tables         : mọi SELECT trên bảng phải có LIMIT (ngoại lệ: -- sqllint:allow=unbounded kèm lý do).
# tenant.tables        : mọi câu lệnh phải lọc "org_id = :orgId" (mỗi bảng một điều kiện; INSERT phải có cột org_id).
#                        Ngoại lệ có chủ đích: -- sqllint:allow=tenant kèm lý do (02_multi_tenant.md §2).
# owner.<bảng>         : module (gói ngay dưới vn.geo.server) sở hữu bảng; mã module khác chạm tới là lỗi.
#                        Ngoại lệ đọc chéo (read model, ADR-GEO-01): -- sqllint:allow=ownership kèm lý do.
# forbidden.app.tables : mã ứng dụng KHÔNG được tham chiếu (luật FORBIDDEN_TABLE, không có ngoại lệ);
#                        chỉ đi qua hàm cổng của CSDL (fn_get_solution, fn_get_solution_teacher).
#
# CHƯA HỖ TRỢ (ghi rõ, không giả là có):
# - Đọc nội dung dùng chung bằng "org_id = :platformOrgId" (ghi chú trong đề xuất ARCH) chưa được coi là bộ lọc trường;
#   hiện phải đánh dấu -- sqllint:allow=tenant kèm lý do. Đã hỏi PO/ARCH trên bảng chung (M-503).
# - E1 đã tạo gói assignment, tracking theo ADR-GEO-01; platform (share_grant) chưa có gói Java.
# - (cũ) Tên module trong owner.* theo ADR-GEO-01 (assignment, tracking, platform) chưa có gói Java tương ứng
#   (khung hiện có iam, tenancy, content, geometry, learning, answers, knowledge, events, aigateway); gói sẽ tạo khi
#   tách migration V10 (sau R3). Không có SQL nào chạm các bảng này nên chưa có vi phạm.

# sample_item, health_probe: bảng của khung (xóa sample_item cùng gói sample và migration V2).
# Các bảng còn lại: schema chính thức theo đề xuất ARCH (03_schema.sql); luật có hiệu lực khi có SQL chạm tới.
large.tables=sample_item,auth_failure,answer_guard_log,event_log,ai_call_log,qa_turn,assignment_progress,assignment,class_member,app_user,problem,problem_version,lecture,keyword,audit_log
tenant.tables=sample_item,teacher_access_code,durable_request,problem_signature,answer_guard_log,app_user,class,class_member,problem,problem_version,scene_build,hint,solution,verification_report,assignment,assignment_progress,event_log,ai_call_log,qa_turn,lecture,keyword,audit_log,share_grant
forbidden.app.tables=solution,verification_report

