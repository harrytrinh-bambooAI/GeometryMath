spring:
  application.name: geo-server
  # KHÔNG có profile mặc định: phải bật tường minh dev | test | prod (ProfileGuard từ chối khởi động nếu thiếu).
  threads.virtual.enabled: true          # mỗi yêu cầu một luồng ảo: chịu hàng nghìn yêu cầu chờ I/O
  datasource:
    url: ${GEO_DB_URL:jdbc:postgresql://127.0.0.1:${GEO_PG_PORT:54329}/geo_dev?ApplicationName=geo-server&connectTimeout=3&socketTimeout=30}
    username: ${GEO_DB_USER:geo}
    password: ${GEO_DB_PASSWORD:}
    # Giá trị và nguồn: app/docs/CONFIG.md (D-GEO-168, ADR-GEO-04, 05_capacity.md §4.2, §7)
    hikari:
      maximum-pool-size: ${GEO_DB_POOL:20}   # 20 kết nối MỖI NÚT; KHÔNG nâng theo số người dùng
      minimum-idle: ${GEO_DB_POOL_MIN:20}    # nhóm cố định cỡ (khuyến nghị của HikariCP)
      connection-timeout: 2000               # chờ lấy kết nối tối đa 2 giây rồi 503 SERVICE_OVERLOADED
      max-lifetime: 1500000                  # 25 phút (ADR-GEO-04)
      # statement_timeout 2 giây cho đường nóng; giao dịch treo quá 10 giây bị đóng (ADR-GEO-12)
      connection-init-sql: SET statement_timeout = 2000; SET idle_in_transaction_session_timeout = 10000
      pool-name: geo-pool
  flyway:
    locations: classpath:db/migration
  data.redis:
    host: ${GEO_REDIS_HOST:127.0.0.1}
    port: ${GEO_REDIS_PORT:6389}
    timeout: 100ms          # lệnh Redis tối đa 100 ms rồi bỏ qua bộ đệm (fail-open, ADR-GEO-05)
    connect-timeout: 100ms
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC          # máy chủ trả ISO-8601 UTC ("...Z"); giao diện luôn hiển thị Asia/Ho_Chi_Minh
  mvc:
    problemdetails.enabled: false

server:
  port: ${GEO_PORT:8080}
  shutdown: graceful
  tomcat:
    max-connections: 10000
    accept-count: 500
    connection-timeout: 10s
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB

geo:
  http:
    max-body-bytes: 1048576   # 1 MB
    retry-after: 2s           # Retry-After mặc định cho 429 RATE_LIMITED / 503 SERVICE_OVERLOADED
    trust-forwarded-for: false  # chỉ bật sau proxy tin cậy (dev/test bật để E2E mô phỏng nhiều IP, TC-GEO-0179)
  time:
    display-zone: Asia/Ho_Chi_Minh   # múi giờ hiển thị duy nhất (BR-GEO-233); lưu/truyền luôn UTC
  content:
    # Gói nội dung Kho đề MVP (content/catalog-mvp.json + geometry/problem-specs.json, T-261126-02): nạp vào bộ 'main' khi
    # khởi động rồi engine tính nhãn. Profile test và make e2e tắt (Kho đề e2e giữ sáu đề, TC-GEO-0125).
    pack.load-on-start: ${GEO_CONTENT_PACK_ON_START:true}
  paging:
    default-limit: 20
    max-limit: 100            # trần chung
    max-limit-by-list:
      "[content.problem-bank]": 50   # Kho đề (D-GEO-142)
    # Khóa dev, KHÔNG dùng ngoài dev. Môi trường thật đặt GEO_CURSOR_KEY (base64 của 32 byte).
    cursor-key: ${GEO_CURSOR_KEY:ZGV2LW9ubHktY3Vyc29yLWtleS0zMi1ieXRlcyEhISE=}
  auth:
    secret: ${GEO_AUTH_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: PT8H
    # Khóa HMAC của mã Giáo viên mẫu và IP (D-GEO-152: CSDL chỉ lưu băm). Môi trường thật đặt GEO_AUTH_CODE_PEPPER.
    code-pepper: ${GEO_AUTH_CODE_PEPPER:dev-only-code-pepper-0123456789abcdef}
  redis.key-prefix: ${GEO_REDIS_PREFIX:geo:}
  ai:
    provider: ${GEO_AI_PROVIDER:mock}       # mock (dev/test/CI) | anthropic; prod cấm mock (ProfileGuard, PO-60)
    timeout: ${GEO_AI_TIMEOUT:10s}          # trần một lượt gọi ở cổng. TẠM: chưa có nguồn (D-GEO-072, owner TechLead)
    model: ${GEO_AI_MODEL:gia-lap-1}        # F-GEO-096; provider anthropic + giá trị giả lập này = "claude-sonnet-5-5" (AiProperties)
    prompt-version: ${GEO_AI_PROMPT_VERSION:p1}   # provider anthropic + "p1" = "a2" (AnthropicPrompts.VERSION)
    cost-per-call: 0.12       # chi phí mô phỏng mỗi lượt của mock (đơn vị chưa xác định, KG-07)
    api-key: ${GEO_AI_API_KEY:}             # chỉ ở máy chủ, không bao giờ xuống trình duyệt/nhật ký (BR-GEO-106)
    anthropic:
      base-url: ${GEO_AI_BASE_URL:https://api.anthropic.com}
      api-version: "2023-06-01"
      max-tokens: 16000
      attempt-timeout: ${GEO_AI_ATTEMPT_TIMEOUT:45s}   # một lần gọi HTTP; tổng (kể cả thử lại) vẫn chịu geo.ai.timeout
      max-retries: 2            # chỉ thử lại 429/5xx/lỗi mạng, có giãn cách; lỗi khác trả ngay
      retry-backoff: 1s
      fallbacks: default        # chuyển model khi bị từ chối an toàn (beta server-side-fallback-2026-07-01); rỗng = tắt
      effort: ${GEO_AI_EFFORT:}  # output_config.effort; rỗng = mặc định của model (Sonnet 5.5: high)
    # Bảng giá (USD / 1 triệu token) để tính chi phí mỗi lượt từ usage thật.
    # Nguồn: bảng giá Anthropic theo skill claude-api "Current Models" (cached 2026-11-03), chép ngày 2026-11-26.
    # cache-read/cache-write bỏ trống = 0,1× / 1,25× giá input (quy tắc bộ nhớ đệm 5 phút).
    pricing:
      claude-sonnet-5-5: { input: 2.00, output: 10.00, cache-read: 0.10 }
      claude-opus-5-5:   { input: 4.00, output: 20.00, cache-read: 0.20 }
      claude-haiku-5-5:  { input: 0.10, output: 0.50 }

  # ===== Chặng 2–3: khóa geo.<feature>.* theo task (T-261126-41, PLAN_code-s23 §5 luật 2) =====
  # Mỗi task chỉ thêm khóa NGAY DƯỚI mốc của mình, thụt 2 dấu cách (con của geo:), ví dụ "  s2e8:".
  # --- T-261126-41 (khung) ---
  # --- T-261126-18 (S2-E1) ---
  s2e1:
    pbkdf2-iterations: ${GEO_S2E1_PBKDF2_ITER:60000}   # vòng PBKDF2-SHA256 băm mật khẩu (số vòng lưu trong chuỗi băm)
    community-org-id: 00000000-0000-7000-8002-000000000100  # trường "Cộng đồng" của tài khoản tự đăng ký (PO-61)
    migrate: false            # true: chạy lệnh chuyển tài khoản MVP rồi thoát (make s2e1-migrate, US-S2E1-04)
  # --- T-261126-19 (S2-E2) ---
  # --- T-261126-20 (S2-E5) ---
  # --- T-261126-21 (S2-E8) ---
  # --- T-261126-22 (S2-E3) ---
  # --- T-261126-23 (S2-E6, S2-E7) ---
  # --- T-261126-24 (S2-E4) ---
  # --- T-261126-25 (S2-E9) ---
  # --- T-261126-42 (S3 dữ liệu mẫu) ---
  # --- T-261126-28 (S3-E1, S3-E5) ---
  # --- T-261126-29 (S3-E2) ---
  # --- T-261126-30 (S3-E3) ---
  tracking.min-aggregate: ${GEO_MIN_AGGREGATE:5}   # MIN_AGGREGATE: số bài làm tối thiểu của một đề để gộp "Cả lớp vướng ở đâu" (PO-65 Q6, PO-66 QA-S3E3-02)
  # --- T-261126-31 (S3-E4, S3-E5) ---
  s3e6-reminders:
    cron: ${GEO_S3E6_REMINDER_CRON:0 * * * * *}   # US-S3E6-03: tác vụ nhắc việc mỗi phút (giờ VN); "-" để tắt
  # --- T-261126-32 (S3-E6, S3-E5) ---
  s3e5:
    access-log-max-days: 7          # BR-S3E5-37: nhật ký truy cập của máy chủ web (có IP) giữ tối đa 7 ngày; Tomcat
                                    # access log mặc định tắt, proxy phía trước phải xoay vòng theo số ngày này
    account-purge-cron: ${GEO_ACCOUNT_PURGE_CRON:0 0 3 * * *}   # US-S3E5-05, Dev-REV-A3: dọn tài khoản đã xóa quá 30 ngày lúc 03:00 giờ VN; "-" để tắt
  # --- FIX (task FIX T-261126-35, 43+) ---

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: geo-server

logging:
  pattern.console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
